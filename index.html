<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Para Camelita 👑 — Aventura de Coronitas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-night: #07070b;
      --gold: #f5d076;
      --pink-neon: #ff7eb6;
      --lilac: #c084fc;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-night);
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
      touch-action: none;
    }

    .font-royal { font-family: 'Cinzel', serif; }

    /* Canvas de cielo estrellado, partículas y fuegos */
    #magic-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Sendero luminoso inferior (suelo del juego) */
    .ground-track {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 92px;
      z-index: 5;
      pointer-events: none;
      background: linear-gradient(to top, rgba(18, 12, 30, 0.95) 0%, rgba(192, 132, 252, 0.14) 75%, transparent 100%);
      border-top: 2px solid rgba(245, 208, 118, 0.32);
      box-shadow: 0 -10px 35px rgba(192, 132, 252, 0.18);
    }

    .ground-dashes {
      position: absolute;
      top: 18px;
      left: 0;
      width: 300%;
      height: 2px;
      background: repeating-linear-gradient(
        to right,
        rgba(245, 208, 118, 0.55) 0px,
        rgba(245, 208, 118, 0.55) 26px,
        transparent 26px,
        transparent 60px
      );
      opacity: 0.55;
    }

    /* Reproductor flotante arriba a la derecha */
    .music-bar {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 70;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .glass-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 9999px;
      background: rgba(16, 16, 26, 0.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(245, 208, 118, 0.35);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.2s ease;
    }
    .glass-pill:active { transform: scale(0.95); }

    .sound-waves {
      display: flex;
      align-items: flex-end;
      gap: 2.5px;
      height: 15px;
    }
    .sound-waves span {
      width: 3px;
      height: 4px;
      border-radius: 3px;
      background: linear-gradient(to top, var(--pink-neon), var(--gold));
    }
    .glass-pill.playing .sound-waves span:nth-child(1) { animation: waveB 0.65s ease-in-out infinite 0.0s; }
    .glass-pill.playing .sound-waves span:nth-child(2) { animation: waveB 0.65s ease-in-out infinite 0.2s; }
    .glass-pill.playing .sound-waves span:nth-child(3) { animation: waveB 0.65s ease-in-out infinite 0.35s; }
    .glass-pill.playing .sound-waves span:nth-child(4) { animation: waveB 0.65s ease-in-out infinite 0.12s; }
    @keyframes waveB {
      0%, 100% { height: 4px; }
      50% { height: 15px; }
    }

    /* HUD Superior Izquierdo (Progreso) */
    #game-hud {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 65;
      padding: 8px 14px;
      border-radius: 18px;
      background: rgba(16, 16, 26, 0.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(245, 208, 118, 0.32);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-10px);
      transition: opacity 0.5s ease, transform 0.5s ease;
      max-width: calc(100vw - 165px);
    }
    #game-hud.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    /* FASE 1: Overlay Intro */
    #intro-overlay {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: radial-gradient(circle at center, #11111e 0%, #07070b 78%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      transition: opacity 0.85s ease, visibility 0.85s ease;
    }
    #intro-overlay.hidden-phase {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .crown-pulse {
      font-size: 3.1rem;
      animation: pulseCrown 2s ease-in-out infinite;
    }
    @keyframes pulseCrown {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 14px rgba(245, 208, 118, 0.7)); }
      50% { transform: scale(1.1); filter: drop-shadow(0 0 28px rgba(255, 126, 182, 0.95)); }
    }

    .open-btn {
      padding: 15px 30px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 1.05rem;
      color: #fff;
      background: rgba(24, 24, 38, 0.88);
      border: 1.5px solid rgba(245, 208, 118, 0.8);
      box-shadow: 0 0 26px rgba(245, 208, 118, 0.35), inset 0 0 14px rgba(255, 126, 182, 0.22);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .open-btn:hover { transform: scale(1.04); }

    .intro-text-box {
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 0.85s ease, transform 0.85s ease;
    }
    .intro-text-box.show { opacity: 1; transform: translateY(0); }
    .intro-text-box.drop-exit { opacity: 0; transform: translateY(-48px); }

    .glow-line-1 {
      color: #e6d5b8;
      text-shadow: 0 0 18px rgba(245, 208, 118, 0.5);
    }
    .glow-line-2 {
      color: #ffffff;
      text-shadow: 0 0 20px rgba(255, 126, 182, 0.9), 0 0 42px rgba(255, 126, 182, 0.55);
    }

    /* Mundo del juego */
    #game-stage {
      position: fixed;
      inset: 0;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    #game-stage.active { opacity: 1; }

    #world-layer {
      position: fixed;
      inset: 0;
      z-index: 15;
      pointer-events: none;
    }

    /* Personaje Camelita (#camelita-player) */
    #camelita-player {
      position: fixed;
      left: 0;
      bottom: 92px;
      width: 112px;
      z-index: 25;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      will-change: transform;
    }

    .name-badge {
      padding: 3px 12px;
      border-radius: 9999px;
      font-size: 0.78rem;
      font-weight: 700;
      color: #fff;
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 215, 140, 0.55);
      box-shadow: 0 0 16px rgba(255, 126, 182, 0.5);
      margin-bottom: 2px;
      white-space: nowrap;
      position: relative;
    }

    /* Globito tierno al chocar */
    .speech-bubble {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%) scale(0.8);
      background: rgba(255, 245, 250, 0.96);
      color: #1e1b2e;
      font-size: 0.74rem;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 14px;
      border: 1.5px solid #ff7eb6;
      box-shadow: 0 4px 16px rgba(255, 126, 182, 0.45);
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .speech-bubble.show {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    #head-dropzone {
      position: relative;
      width: 64px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: -12px;
      z-index: 28;
      border-radius: 9999px;
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }
    #head-dropzone.drag-hover {
      background: rgba(245, 208, 118, 0.28);
      box-shadow: 0 0 26px rgba(245, 208, 118, 0.85);
    }

    #worn-crown {
      width: 48px;
      height: 34px;
      opacity: 0;
      transform: scale(0.4);
      transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.4s ease;
      filter: drop-shadow(0 0 10px rgba(245, 208, 118, 0.85));
    }
    #worn-crown.visible {
      opacity: 1;
      transform: scale(1);
    }
    #worn-crown.level-1 { filter: drop-shadow(0 0 14px rgba(186, 230, 253, 0.95)); }
    #worn-crown.level-2 { filter: drop-shadow(0 0 18px rgba(192, 132, 252, 0.95)); }
    #worn-crown.level-3 { filter: drop-shadow(0 0 20px rgba(255, 126, 182, 0.95)); }
    #worn-crown.level-4 { filter: drop-shadow(0 0 26px rgba(245, 208, 118, 1)); transform: scale(1.12); }

    #camelita-svg {
      width: 108px;
      height: 140px;
      overflow: visible;
      filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.65));
      transition: transform 0.12s ease;
    }

    /* Estados de animación de Camelita */
    #camelita-player.sitting #left-leg {
      transform-origin: 58px 142px;
      transform: rotate(36deg) translate(-6px, -6px);
    }
    #camelita-player.sitting #right-leg {
      transform-origin: 90px 142px;
      transform: rotate(-36deg) translate(6px, -6px);
    }
    #camelita-player.sitting #camelita-svg {
      transform: translateY(12px);
    }

    #camelita-player.walking #left-leg {
      transform-origin: 60px 140px;
      animation: legSwingA 0.36s ease-in-out infinite;
    }
    #camelita-player.walking #right-leg {
      transform-origin: 88px 140px;
      animation: legSwingB 0.36s ease-in-out infinite;
    }
    #camelita-player.walking #left-arm {
      transform-origin: 46px 104px;
      animation: armSwingB 0.36s ease-in-out infinite;
    }
    #camelita-player.walking #right-arm {
      transform-origin: 102px 104px;
      animation: armSwingA 0.36s ease-in-out infinite;
    }
    #camelita-player.walking #body {
      animation: bodyBob 0.36s ease-in-out infinite;
    }

    #camelita-player.airborne #left-leg {
      transform-origin: 60px 140px;
      transform: rotate(-18deg);
    }
    #camelita-player.airborne #right-leg {
      transform-origin: 88px 140px;
      transform: rotate(18deg);
    }
    #camelita-player.airborne #left-arm {
      transform-origin: 46px 104px;
      transform: rotate(45deg);
    }
    #camelita-player.airborne #right-arm {
      transform-origin: 102px 104px;
      transform: rotate(-45deg);
    }

    @keyframes legSwingA { 0%, 100% { transform: rotate(-18deg); } 50% { transform: rotate(20deg); } }
    @keyframes legSwingB { 0%, 100% { transform: rotate(20deg); } 50% { transform: rotate(-18deg); } }
    @keyframes armSwingA { 0%, 100% { transform: rotate(-15deg); } 50% { transform: rotate(16deg); } }
    @keyframes armSwingB { 0%, 100% { transform: rotate(16deg); } 50% { transform: rotate(-15deg); } }
    @keyframes bodyBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

    #eyes {
      transform-origin: 74px 66px;
      animation: blinkEyes 4.4s infinite;
    }
    @keyframes blinkEyes {
      0%, 94%, 100% { transform: scaleY(1); }
      97% { transform: scaleY(0.1); }
    }

    /* Corona arrastrable inicial (sin transform en contenedor padre) */
    #draggable-crown-wrap {
      position: fixed;
      top: 15%;
      left: 0;
      right: 0;
      z-index: 45;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
    #draggable-crown-wrap.done {
      opacity: 0;
      pointer-events: none;
    }

    #draggable-crown {
      width: 78px;
      height: 56px;
      cursor: grab;
      pointer-events: auto;
      touch-action: none;
      filter: drop-shadow(0 0 20px rgba(245, 208, 118, 0.9));
      animation: floatCrown 2.2s ease-in-out infinite;
    }
    #draggable-crown.dragging {
      position: fixed;
      animation: none;
      cursor: grabbing;
      transform: scale(1.16);
      z-index: 95;
    }
    @keyframes floatCrown {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-10px) rotate(3deg); }
    }

    .drag-hint {
      font-size: 0.85rem;
      color: #f5d076;
      background: rgba(14, 14, 24, 0.78);
      border: 1px solid rgba(245, 208, 118, 0.4);
      padding: 6px 14px;
      border-radius: 9999px;
      backdrop-filter: blur(8px);
      text-align: center;
      max-width: 88vw;
    }

    /* Controles táctiles del minijuego */
    #touch-controls {
      position: fixed;
      bottom: 16px;
      left: 16px;
      right: 16px;
      z-index: 60;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.45s ease;
    }
    #touch-controls.visible {
      opacity: 1;
    }

    .pad-btn {
      pointer-events: auto;
      touch-action: none;
      width: 58px;
      height: 58px;
      border-radius: 18px;
      background: rgba(20, 20, 34, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid rgba(245, 208, 118, 0.45);
      color: #fff;
      font-size: 1.35rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
      transition: transform 0.1s ease, background 0.1s ease;
    }
    .pad-btn:active, .pad-btn.pressed {
      transform: scale(0.92);
      background: rgba(245, 208, 118, 0.25);
    }

    .jump-btn {
      pointer-events: auto;
      touch-action: none;
      height: 60px;
      padding: 0 22px;
      border-radius: 9999px;
      background: linear-gradient(135deg, rgba(245, 208, 118, 0.28), rgba(255, 126, 182, 0.35));
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid rgba(255, 126, 182, 0.75);
      color: #fff;
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      box-shadow: 0 0 24px rgba(255, 126, 182, 0.35);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .jump-btn:active, .jump-btn.pressed {
      transform: scale(0.93);
    }

    /* Elementos del mundo (obstáculos, coronas, cofre) */
    .world-item {
      position: absolute;
      bottom: 92px;
      will-change: transform;
    }
    .collect-crown {
      animation: floatCrown 1.8s ease-in-out infinite;
      filter: drop-shadow(0 0 16px rgba(245, 208, 118, 0.95));
    }

    /* Modales Glassmorphism */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: rgba(7, 7, 12, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }
    .modal-backdrop.open {
      opacity: 1;
      visibility: visible;
    }

    .royal-modal {
      width: 100%;
      max-width: 420px;
      max-height: 88vh;
      overflow-y: auto;
      border-radius: 26px;
      background: linear-gradient(160deg, rgba(22, 20, 36, 0.95), rgba(11, 10, 18, 0.98));
      border: 1.5px solid rgba(245, 208, 118, 0.6);
      box-shadow: 0 0 55px rgba(255, 126, 182, 0.25);
    }
  </style>
</head>
<body>

  <!-- Canvas de partículas y estrellas en Parallax -->
  <canvas id="magic-canvas"></canvas>

  <!-- HUD Superior Izquierdo -->
  <div id="game-hud">
    <div class="flex items-center gap-2 text-xs sm:text-sm font-bold text-amber-200">
      <span>Coronitas de Camelita:</span>
      <span id="hud-count" class="text-pink-300">0 / 4 👑</span>
    </div>
    <div class="w-full h-2 bg-white/10 rounded-full mt-1.5 overflow-hidden border border-white/10">
      <div id="hud-progress" class="h-full w-0 bg-gradient-to-r from-amber-300 via-pink-400 to-purple-400 transition-all duration-300"></div>
    </div>
  </div>

  <!-- Reproductor flotante arriba a la derecha + botón ⚙️ -->
  <div class="music-bar">
    <button class="glass-pill" id="audio-btn" title="Play / Pausa">
      <div class="sound-waves"><span></span><span></span><span></span><span></span></div>
      <span class="text-xs font-semibold text-amber-100" id="audio-label">Música</span>
    </button>
    <button class="glass-pill" id="btn-music-settings" title="Cambiar link de música">⚙️</button>
  </div>
  <audio id="bg-music" loop preload="auto"></audio>

  <!-- FASE 1: Pantalla de Inicio e Intro -->
  <div id="intro-overlay">
    <div id="unlock-box" class="flex flex-col items-center gap-6">
      <div class="crown-pulse">👑</div>
      <p class="font-royal text-xs tracking-[0.28em] uppercase text-amber-200/75">Aventura Especial</p>
      <button id="open-btn" class="open-btn">
        Para Camelita 👑 <span class="text-pink-300 text-sm block mt-1 font-normal">(Toca para comenzar)</span>
      </button>
    </div>

    <div id="intro-text-box" class="intro-text-box hidden max-w-lg px-4">
      <p id="intro-line-1" class="font-royal text-lg sm:text-2xl tracking-widest glow-line-1 mb-4"></p>
      <p id="intro-line-2" class="font-royal text-xl sm:text-3xl font-bold tracking-wider glow-line-2"></p>
    </div>
  </div>

  <!-- FASE 2 & 3: Escenario del Minijuego -->
  <main id="game-stage">
    <div class="ground-track">
      <div class="ground-dashes" id="ground-dashes"></div>
    </div>

    <!-- Capa de obstáculos, coronas y cofre -->
    <div id="world-layer"></div>

    <!-- Corona arrastrable inicial -->
    <div id="draggable-crown-wrap">
      <svg id="draggable-crown" viewBox="0 0 100 70" fill="none">
        <defs>
          <linearGradient id="crownGold" x1="0" y1="0" x2="100" y2="70" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#fde68a"/>
            <stop offset="50%" stop-color="#f59e0b"/>
            <stop offset="100%" stop-color="#fef08a"/>
          </linearGradient>
        </defs>
        <path d="M12 56 L6 20 L30 38 L50 10 L70 38 L94 20 L88 56 Z" fill="url(#crownGold)" stroke="#fff7ed" stroke-width="2.5" stroke-linejoin="round"/>
        <rect x="12" y="54" width="76" height="8" rx="4" fill="#d97706" stroke="#fff7ed" stroke-width="2"/>
        <circle cx="50" cy="10" r="4.5" fill="#ff7eb6"/>
        <circle cx="6" cy="20" r="4" fill="#e0f2fe"/>
        <circle cx="94" cy="20" r="4" fill="#e0f2fe"/>
      </svg>
      <div class="drag-hint">Arrastra la coronita hacia la cabeza de Camelita para empezar la aventura 👑👇</div>
    </div>

    <!-- Personaje 2D Camelita -->
    <div id="camelita-player" class="sitting">
      <div class="name-badge">
        ✨ Camelita ✨
        <div class="speech-bubble" id="speech-bubble">¡Ups! Casi 🥺</div>
      </div>

      <div id="head-dropzone">
        <svg id="worn-crown" viewBox="0 0 100 70" fill="none">
          <path d="M12 56 L6 20 L30 38 L50 10 L70 38 L94 20 L88 56 Z" fill="url(#crownGold)" stroke="#fff7ed" stroke-width="2.5" stroke-linejoin="round"/>
          <rect x="12" y="54" width="76" height="8" rx="4" fill="#d97706" stroke="#fff7ed" stroke-width="2"/>
          <circle cx="50" cy="10" r="4.5" fill="#ff7eb6"/>
          <circle cx="6" cy="20" r="3.5" fill="#e0f2fe"/>
          <circle cx="94" cy="20" r="3.5" fill="#e0f2fe"/>
        </svg>
      </div>

      <svg id="camelita-svg" viewBox="0 0 148 190" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g id="hair-back">
          <path d="M36 52 C28 84 26 122 34 142 C46 146 102 146 114 142 C122 122 120 84 112 52 C102 24 46 24 36 52 Z" fill="#18141c" stroke="#0b090e" stroke-width="2.5"/>
        </g>
        <g id="left-leg">
          <rect x="54" y="138" width="14" height="36" rx="7" fill="#c68b67" stroke="#2d1e17" stroke-width="2"/>
          <path d="M51 168 C51 164 69 164 70 172 C70 176 50 176 51 168 Z" fill="#181822" stroke="#3b3b4d" stroke-width="1.5"/>
        </g>
        <g id="right-leg">
          <rect x="80" y="138" width="14" height="36" rx="7" fill="#c68b67" stroke="#2d1e17" stroke-width="2"/>
          <path d="M78 168 C78 164 96 164 97 172 C97 176 77 176 78 168 Z" fill="#181822" stroke="#3b3b4d" stroke-width="1.5"/>
        </g>
        <g id="left-arm">
          <path d="M46 102 C32 114 28 132 36 138 C42 142 50 132 52 116 Z" fill="#14141d" stroke="#2e2e3d" stroke-width="2" stroke-linejoin="round"/>
          <circle cx="38" cy="137" r="6" fill="#c68b67" stroke="#2d1e17" stroke-width="1.8"/>
        </g>
        <g id="right-arm">

  <!-- Modal ⚙️ Cambiar Música en Vivo -->
  <div id="music-modal" class="modal-backdrop">

        <button id="btn-close-music" class="glass-pill text-xs px-4 py-2.5">Cerrar</button>

  <script>
    // =========================================================================
    // 👇 PEGA AQUÍ EL LINK DE TU MÚSICA 👇
    // =========================================================================
    const CONFIG = {
      // Ruta local ("./musica.mp3") o URL directa a un archivo .mp3
      musicUrl: "./musica.mp3",
      // Segundo exacto donde debe iniciar la canción
      musicStartTime: 0,

      // Textos de la Intro (Fase 1)
      introDateText: "14 DE NOVIEMBRE? NO IMPORTA EL DÍA...",
      introSubText: "ESTAS CORONITAS SON PARA TI, CAMELITA 💗... <3",
      introDurationMs: 4500,

      // Las 4 Coronas del Nivel
      crowns: [
        {
          title: "Corona de Diamantes y Hielo",
          image: "https://images.unsplash.com/photo-1596944924616-7b38e7cfac36?auto=format&fit=crop&w=900&q=80",
          message: "¡1ra Corona conseguida! Por esos ojitos tan lindos y por tener esa luz que brilla incluso en los días más grises ✨"
        },
        {
          title: "Corona Oscura & Estética",
          image: "https://images.unsplash.com/photo-1535632066927-ab7c9ab60908?auto=format&fit=crop&w=900&q=80",
          message: "¡2da Corona atrapada! Para la niña más inquieta, única y auténtica; porque tu vibra tan bonita no la tiene nadie más 💜"
        },
        {
          title: "Corona sobre Rosas Rojas",
          image: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=900&q=80",
          message: "¡3ra Corona desbloqueada! Porque hay personas, risas y momentos que se quedan guardados con cariño sin importar el tiempo 🌹"
        },
        {
          title: "Corona Real de Reina",
          image: "https://images.unsplash.com/photo-1605100804763-247f67b3557e?auto=format&fit=crop&w=900&q=80",
          message: "¡4ta Corona conseguida! Porque sea 14 de noviembre o cualquier otro día, Camelita siempre merece todo lo bonito de este mundo 👑"
        }
      ],

      // Carta Secreta Final (Fase 4)
      finalLetter:
        "No importa si es 14 de noviembre o cualquier otro día del calendario: siempre habrá mil razones para recordarte lo especial que eres.\n\n" +
        "Atravesaste cada obstáculo y reuniste las 4 coronas, aunque la verdad es que todas ya eran tuyas desde el principio.\n\n" +
        "Nunca pierdas esa luz tan bonita, Camelita. Mereces todo lo bueno de este mundo hoy y siempre. 💗👑✨"
    };

    // =========================================================================
    // MOTOR DE PARTÍCULAS Y ESTRELLAS EN CANVAS
    // =========================================================================
    const canvas = document.getElementById("magic-canvas");
    const ctx = canvas.getContext("2d");
    let cw = 0, ch = 0;
    let cameraX = 0;

    const palette = ["rgba(245, 208, 118,", "rgba(226, 232, 240,", "rgba(192, 132, 252,"];
    const stars = Array.from({ length: 95 }, () => ({
      x: Math.random() * 2000,
      y: Math.random() * 0.85,
      r: 0.8 + Math.random() * 2.2,
      p: Math.random() * Math.PI * 2,
      c: palette[Math.floor(Math.random() * palette.length)]
    }));

    const bursts = [];
    function spawnBurst(x, y, count = 36, rain = false) {
      for (let i = 0; i < count; i++) {
        const ang = (Math.PI * 2 * i) / count + Math.random() * 0.3;
        const spd = rain ? 1.5 + Math.random() * 2.5 : 2 + Math.random() * 5;
        bursts.push({
          x,
          y,
          vx: rain ? (Math.random() - 0.5) * 3 : Math.cos(ang) * spd,
          vy: rain ? 1 + Math.random() * 3 : Math.sin(ang) * spd - 1.5,
          life: 1,
          decay: rain ? 0.008 : 0.018 + Math.random() * 0.015,
          heart: i % 2 === 0,
          size: 6 + Math.random() * 8,
          color: i % 2 === 0 ? "#ff7eb6" : "#f5d076"
        });
      }
    }

    function resizeCanvas() {
      cw = canvas.width = window.innerWidth;
      ch = canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function drawHeart(x, y, size, color, alpha) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = color;
      ctx.translate(x, y);
      const s = size * 0.48;
      ctx.beginPath();
      ctx.moveTo(0, s * 0.4);
      ctx.bezierCurveTo(-s, -s * 0.5, -s * 1.6, s * 0.6, 0, s * 1.5);
      ctx.bezierCurveTo(s * 1.6, s * 0.6, s, -s * 0.5, 0, s * 0.4);
      ctx.fill();
      ctx.restore();
    }

    function renderParticles() {
      ctx.clearRect(0, 0, cw, ch);
      const t = Date.now() * 0.0025;

      stars.forEach((s) => {
        const sx = ((s.x - cameraX * 0.18) % cw + cw) % cw;
        const sy = s.y * ch;
        const alpha = 0.35 + 0.55 * Math.sin(t + s.p);
        ctx.fillStyle = `${s.c} ${Math.max(0.1, alpha)})`;
        ctx.beginPath();
        ctx.arc(sx, sy, s.r, 0, Math.PI * 2);
        ctx.fill();
      });

      for (let i = bursts.length - 1; i >= 0; i--) {
        const p = bursts[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.08;
        p.life -= p.decay;
        if (p.life <= 0) {
          bursts.splice(i, 1);
          continue;
        }
        if (p.heart) drawHeart(p.x, p.y, p.size, p.color, p.life);
        else {
          ctx.save();
          ctx.globalAlpha = p.life;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * 0.34, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      requestAnimationFrame(renderParticles);
    }
    renderParticles();

    // =========================================================================
    // AUDIO Y REPRODUCTOR EN VIVO
    // =========================================================================
    const bgMusic = document.getElementById("bg-music");
    const audioBtn = document.getElementById("audio-btn");
    const audioLabel = document.getElementById("audio-label");
    const btnMusicSettings = document.getElementById("btn-music-settings");
    const musicModal = document.getElementById("music-modal");
    const musicUrlInput = document.getElementById("music-url-input");
    const btnSaveMusic = document.getElementById("btn-save-music");
    const btnCloseMusic = document.getElementById("btn-close-music");

    function setAudioSource(url, startTime = 0) {
      if (!url) return;
      bgMusic.src = url;
      bgMusic.currentTime = startTime || 0;
    }
    setAudioSource(CONFIG.musicUrl, CONFIG.musicStartTime);
    musicUrlInput.value = CONFIG.musicUrl;

    function updateAudioUI() {
      if (!bgMusic.paused) {
        audioBtn.classList.add("playing");
        audioLabel.textContent = "Sonando";
      } else {
        audioBtn.classList.remove("playing");
        audioLabel.textContent = "Música";
      }
    }

    async function tryPlayMusic() {
      if (!bgMusic.src) return;
      try {
        if (bgMusic.currentTime < CONFIG.musicStartTime) {
          bgMusic.currentTime = CONFIG.musicStartTime;
        }
        await bgMusic.play();
      } catch {}
      updateAudioUI();
    }

    audioBtn.addEventListener("click", async () => {
      if (bgMusic.paused) await tryPlayMusic();
      else {
        bgMusic.pause();
        updateAudioUI();
      }
    });

    btnMusicSettings.addEventListener("click", () => {
      musicUrlInput.value = CONFIG.musicUrl;
      musicModal.classList.add("open");
    });
    btnCloseMusic.addEventListener("click", () => musicModal.classList.remove("open"));
    btnSaveMusic.addEventListener("click", async () => {
      const val = musicUrlInput.value.trim();
      CONFIG.musicUrl = val;
      if (val) {
        setAudioSource(val, CONFIG.musicStartTime);
        await tryPlayMusic();
      } else {
        bgMusic.pause();
        updateAudioUI();
      }
      musicModal.classList.remove("open");
    });

    // =========================================================================
    // FASE 1: INTRO SINCRONIZADA
    // =========================================================================
    const introOverlay = document.getElementById("intro-overlay");
    const unlockBox = document.getElementById("unlock-box");
    const openBtn = document.getElementById("open-btn");
    const introTextBox = document.getElementById("intro-text-box");
    const gameStage = document.getElementById("game-stage");

    document.getElementById("intro-line-1").textContent = CONFIG.introDateText;
    document.getElementById("intro-line-2").textContent = CONFIG.introSubText;

    openBtn.addEventListener("click", async () => {
      tryPlayMusic();
      unlockBox.style.opacity = "0";
      unlockBox.style.pointerEvents = "none";
      setTimeout(() => {
        unlockBox.classList.add("hidden");
        introTextBox.classList.remove("hidden");
        requestAnimationFrame(() => introTextBox.classList.add("show"));
      }, 350);

      setTimeout(() => {
        introTextBox.classList.add("drop-exit");
        setTimeout(() => {
          introOverlay.classList.add("hidden-phase");
          gameStage.classList.add("active");
          initDragAndDrop();
        }, 650);
      }, CONFIG.introDurationMs);
    });

    // =========================================================================
    // FASE 2: DRAG & DROP CORONITA INICIAL
    // =========================================================================
    const camelitaPlayer = document.getElementById("camelita-player");
    const camelitaSvg = document.getElementById("camelita-svg");
    const headDropzone = document.getElementById("head-dropzone");
    const wornCrown = document.getElementById("worn-crown");
    const draggableWrap = document.getElementById("draggable-crown-wrap");
    const draggableCrown = document.getElementById("draggable-crown");
    const mouthPath = document.getElementById("mouth-path");
    const blushL = document.getElementById("blush-l");
    const blushR = document.getElementById("blush-r");

    let isCrowned = false;
    let isDraggingCrown = false;

    function initDragAndDrop() {
      // Posicionar a Camelita sentada en el centro inicialmente
      player.x = window.innerWidth * 0.5;
      updatePlayerDOM();
    }

    function isNearHead(cx, cy) {
      const r = headDropzone.getBoundingClientRect();
      const hx = r.left + r.width / 2;
      const hy = r.top + r.height / 2;
      return Math.hypot(cx - hx, cy - hy) <= 95;
    }

    draggableCrown.addEventListener("pointerdown", (e) => {
      if (isCrowned) return;
      e.preventDefault();
      isDraggingCrown = true;
      draggableCrown.classList.add("dragging");
      draggableCrown.style.left = `${e.clientX - 39}px`;
      draggableCrown.style.top = `${e.clientY - 28}px`;
    });

    window.addEventListener("pointermove", (e) => {
      if (!isDraggingCrown || isCrowned) return;
      draggableCrown.style.left = `${e.clientX - 39}px`;
      draggableCrown.style.top = `${e.clientY - 28}px`;
      headDropzone.classList.toggle("drag-hover", isNearHead(e.clientX, e.clientY));
    });

    function endCrownDrag(e) {
      if (!isDraggingCrown || isCrowned) return;
      isDraggingCrown = false;
      headDropzone.classList.remove("drag-hover");
      if (e && isNearHead(e.clientX, e.clientY)) {
        crownCamelita();
      } else {
        draggableCrown.classList.remove("dragging");
        draggableCrown.style.left = "";
        draggableCrown.style.top = "";
      }
    }
    window.addEventListener("pointerup", endCrownDrag);
    window.addEventListener("pointercancel", endCrownDrag);

    function crownCamelita() {
      isCrowned = true;
      draggableWrap.classList.add("done");
      wornCrown.classList.add("visible");
      mouthPath.setAttribute("d", "M66 79 Q74 88 82 79");
      blushL.setAttribute("opacity", "0.85");
      blushR.setAttribute("opacity", "0.85");

      const r = headDropzone.getBoundingClientRect();
      spawnBurst(r.left + r.width / 2, r.top + r.height / 2, 46);

      camelitaPlayer.classList.remove("sitting");
      player.vy = 9.5; // Pequeño salto feliz al ponerse de pie

      setTimeout(() => {
        startMinigame();
      }, 600);
    }

    // =========================================================================
    // FASE 3 & 4: MOTOR DE PLATAFORMAS 2D (SIDE-SCROLLER)
    // =========================================================================
    const worldLayer = document.getElementById("world-layer");
    const groundDashes = document.getElementById("ground-dashes");
    const gameHud = document.getElementById("game-hud");
    const hudCount = document.getElementById("hud-count");
    const hudProgress = document.getElementById("hud-progress");
    const touchControls = document.getElementById("touch-controls");
    const speechBubble = document.getElementById("speech-bubble");

    const crownModal = document.getElementById("crown-modal");
    const crownModalImg = document.getElementById("crown-modal-img");
    const crownModalBadge = document.getElementById("crown-modal-badge");
    const crownModalTitle = document.getElementById("crown-modal-title");
    const crownModalText = document.getElementById("crown-modal-text");
    const btnContinueGame = document.getElementById("btn-continue-game");

    const finalModal = document.getElementById("final-modal");
    const finalLetterText = document.getElementById("final-letter-text");
    const btnReplayGame = document.getElementById("btn-replay-game");
    finalLetterText.textContent = CONFIG.finalLetter;

    const WORLD_WIDTH = 3400;
    const GOAL_X = 3150;

    const player = {
      x: 160,
      y: 0,
      vx: 0,
      vy: 0,
      facing: 1,
      grounded: true,
      invuln: 0
    };

    const keys = { left: false, right: false, jump: false };
    let gameActive = false;
    let gamePaused = false;
    let collectedCount = 0;
    let goalReached = false;
    let typewriterTimer = null;

    // Definición de obstáculos estéticos y las 4 coronas en el nivel
    let obstacles = [];
    let collectibles = [];
    let goalChestEl = null;

    function buildWorld() {
      worldLayer.innerHTML = "";
      obstacles = [
        { x: 460, type: "bush", w: 46, h: 44 },
        { x: 760, type: "crystal", w: 38, h: 48 },
        { x: 1120, type: "cloud", w: 58, h: 42 },
        { x: 1460, type: "bush", w: 46, h: 44 },
        { x: 1840, type: "crystal", w: 38, h: 48 },
        { x: 2180, type: "cloud", w: 58, h: 42 },
        { x: 2540, type: "bush", w: 46, h: 44 },
        { x: 2860, type: "crystal", w: 38, h: 48 }
      ];

      obstacles.forEach((ob) => {
        const el = document.createElement("div");
        el.className = "world-item";
        if (ob.type === "bush") {
          el.innerHTML = `
            <svg width="56" height="50" viewBox="0 0 56 50">
              <ellipse cx="28" cy="36" rx="24" ry="14" fill="#18221e" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.35"/>
              <circle cx="18" cy="24" r="12" fill="#1b2a22"/>
              <circle cx="38" cy="24" r="12" fill="#1b2a22"/>
              <circle cx="28" cy="18" r="13" fill="#22352b"/>
              <circle cx="20" cy="20" r="4.5" fill="#e11d48"/>
              <circle cx="36" cy="22" r="4" fill="#fb7185"/>
              <circle cx="28" cy="12" r="4.5" fill="#be123c"/>
            </svg>
          `;
        } else if (ob.type === "crystal") {
          el.innerHTML = `
            <svg width="44" height="54" viewBox="0 0 44 54">
              <polygon points="22,2 34,24 28,52 16,52 10,24" fill="#7c3aed" stroke="#e9d5ff" stroke-width="1.5"/>
              <polygon points="10,24 22,2 22,52 16,52" fill="#a855f7" opacity="0.65"/>
              <polygon points="6,32 14,22 18,52 8,52" fill="#5b21b6"/>
            </svg>
          `;
        } else {
          el.innerHTML = `
            <svg width="64" height="46" viewBox="0 0 64 46">
              <path d="M16 38 H50 A10 10 0 0 0 50 18 A14 14 0 0 0 24 14 A11 11 0 0 0 16 38 Z" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
              <path d="M32 34 L27 42 L33 42 L29 46" stroke="#fde047" stroke-width="2" fill="none" stroke-linecap="round"/>
            </svg>
          `;
        }
        worldLayer.appendChild(el);
        ob.el = el;
      });

      // 4 Coronitas flotantes a altura saltable
      const crownXs = [890, 1580, 2310, 2970];
      collectibles = CONFIG.crowns.map((c, idx) => {
        const el = document.createElement("div");
        el.className = "world-item collect-crown";
        el.innerHTML = `
          <svg width="58" height="44" viewBox="0 0 100 70" fill="none">
            <path d="M12 56 L6 20 L30 38 L50 10 L70 38 L94 20 L88 56 Z" fill="url(#crownGold)" stroke="#fff7ed" stroke-width="3"/>
            <rect x="12" y="54" width="76" height="8" rx="4" fill="#d97706" stroke="#fff7ed" stroke-width="2"/>
            <circle cx="50" cy="10" r="5" fill="#ff7eb6"/>
          </svg>
        `;
        worldLayer.appendChild(el);
        return { index: idx, x: crownXs[idx], y: 112, collected: false, el };
      });

      // Cofre / Sobre Real al final del camino
      goalChestEl = document.createElement("div");
      goalChestEl.className = "world-item collect-crown";
      goalChestEl.innerHTML = `
        <div class="flex flex-col items-center">
          <div class="text-5xl drop-shadow-[0_0_20px_rgba(245,208,118,0.9)]">💌</div>
          <span class="text-[11px] font-royal text-amber-200 bg-black/70 px-2.5 py-0.5 rounded-full border border-amber-200/40 mt-1">Meta Final</span>
        </div>
      `;
      worldLayer.appendChild(goalChestEl);
    }

    function startMinigame() {
      buildWorld();
      gameActive = true;
      gamePaused = false;
      collectedCount = 0;
      goalReached = false;
      player.x = 160;
      player.y = 0;
      player.vx = 0;
      player.vy = 0;
      player.invuln = 0;
      cameraX = 0;

      gameHud.classList.add("visible");
      touchControls.classList.add("visible");
      updateHud();
      requestAnimationFrame(gameLoop);
    }

    function updateHud() {
      hudCount.textContent = `${collectedCount} / ${CONFIG.crowns.length} 👑`;
      const pct = Math.min(100, Math.max(0, (player.x / GOAL_X) * 100));
      hudProgress.style.width = `${pct}%`;
    }

    const FRIENDLY_PHRASES = [
      "¡Ups! Casi 🥺",
      "¡Salta más alto, Camelita! ✨",
      "¡Tú puedes! 💖"
    ];
    let bubbleTimer = null;
    function showFriendlyBubble() {
      speechBubble.textContent = FRIENDLY_PHRASES[Math.floor(Math.random() * FRIENDLY_PHRASES.length)];
      speechBubble.classList.add("show");
      clearTimeout(bubbleTimer);
      bubbleTimer = setTimeout(() => speechBubble.classList.remove("show"), 1500);
    }

    function updatePlayerDOM() {
      const screenX = player.x - cameraX - 56;
      camelitaPlayer.style.transform = `translate3d(${screenX}px, ${-player.y}px, 0)`;
      camelitaSvg.style.transform = `scaleX(${player.facing})`;

      if (!isCrowned) return;
      camelitaPlayer.classList.toggle("airborne", !player.grounded);
      camelitaPlayer.classList.toggle("walking", player.grounded && Math.abs(player.vx) > 0.4);
    }

    function gameLoop() {
      if (!gameActive) return;

      if (!gamePaused && !goalReached) {
        // Movimiento horizontal
        const moveSpeed = 4.6;
        if (keys.left) {
          player.vx = -moveSpeed;
          player.facing = -1;
        } else if (keys.right) {
          player.vx = moveSpeed;
          player.facing = 1;
        } else {
          player.vx *= 0.78;
        }

        // Salto
        if (keys.jump && player.grounded) {
          player.vy = 13.8;
          player.grounded = false;
        }

        // Gravedad suave
        player.vy -= 0.62;
        player.x += player.vx;
        player.y += player.vy;

        if (player.y <= 0) {
          player.y = 0;
          player.vy = 0;
          player.grounded = true;
        }

        // Límites del mundo
        if (player.x < 60) player.x = 60;
        if (player.x > WORLD_WIDTH) player.x = WORLD_WIDTH;

        if (player.invuln > 0) player.invuln--;

        // Cámara lateral centrando a Camelita en 32% de pantalla
        const targetCam = Math.max(0, Math.min(WORLD_WIDTH - cw, player.x - cw * 0.34));
        cameraX += (targetCam - cameraX) * 0.14;
        groundDashes.style.transform = `translate3d(${-(cameraX % 60)}px, 0, 0)`;

        // Colisión amigable con obstáculos ("Modo Sin Frustración")
        if (player.invuln === 0) {
          for (const ob of obstacles) {
            if (Math.abs(player.x - ob.x) < ob.w * 0.55 && player.y < ob.h - 6) {
              player.invuln = 45;
              player.vx = -player.facing * 5.2;
              player.vy = 6.5;
              player.grounded = false;
              showFriendlyBubble();
              spawnBurst(player.x - cameraX, ch - 135 - player.y, 16);
              break;
            }
          }
        }

        // Atrapar las 4 coronitas
        for (const c of collectibles) {
          if (!c.collected && Math.abs(player.x - c.x) < 42 && Math.abs(player.y - c.y) < 52) {
            c.collected = true;
            c.el.style.display = "none";
            collectedCount++;
            wornCrown.className = `visible level-${collectedCount}`;
            spawnBurst(c.x - cameraX, ch - 92 - c.y, 44);
            openCrownModal(c.index);
            break;
          }
        }

        // Meta final (Cofre al conseguir las 4/4 coronas)
        if (collectedCount >= CONFIG.crowns.length && Math.abs(player.x - GOAL_X) < 55 && player.y < 70) {
          triggerFinalGoal();
        }

        updateHud();
      }

      // Actualizar posiciones visuales del mundo
      obstacles.forEach((ob) => {
        ob.el.style.transform = `translate3d(${ob.x - cameraX - ob.w / 2}px, 0, 0)`;
      });
      collectibles.forEach((c) => {
        if (!c.collected) {
          c.el.style.transform = `translate3d(${c.x - cameraX - 29}px, ${-c.y}px, 0)`;
        }
      });
      if (goalChestEl) {
        goalChestEl.style.display = collectedCount >= CONFIG.crowns.length ? "block" : "none";
        goalChestEl.style.transform = `translate3d(${GOAL_X - cameraX - 28}px, -16px, 0)`;
      }

      updatePlayerDOM();
      requestAnimationFrame(gameLoop);
    }

    function openCrownModal(idx) {
      gamePaused = true;
      keys.left = keys.right = keys.jump = false;
      const data = CONFIG.crowns[idx];
      crownModalImg.src = data.image;
      crownModalBadge.textContent = `Corona ${idx + 1} de ${CONFIG.crowns.length}`;
      crownModalTitle.textContent = data.title;

      clearInterval(typewriterTimer);
      crownModalText.textContent = "";
      let i = 0;
      typewriterTimer = setInterval(() => {
        crownModalText.textContent += data.message.charAt(i);
        i++;
        if (i >= data.message.length) clearInterval(typewriterTimer);
      }, 26);

      btnContinueGame.textContent =
        idx === CONFIG.crowns.length - 1
          ? "Ir hacia el Cofre Final 💌✨"
          : "Seguir jugando por la siguiente corona 🎮✨";

      crownModal.classList.add("open");
    }

    btnContinueGame.addEventListener("click", () => {
      crownModal.classList.remove("open");
      gamePaused = false;
    });

    function triggerFinalGoal() {
      goalReached = true;
      keys.left = keys.right = keys.jump = false;
      // Lluvia de corazones y saltitos felices
      const rainInterval = setInterval(() => {
        if (!goalReached) { clearInterval(rainInterval); return; }
        spawnBurst(Math.random() * cw, 20, 10, true);
      }, 260);

      let hops = 0;
      const hopTimer = setInterval(() => {
        if (hops >= 3) {
          clearInterval(hopTimer);
          finalModal.classList.add("open");
          return;
        }
        player.vy = 10;
        player.grounded = false;
        hops++;
      }, 420);
    }

    btnReplayGame.addEventListener("click", () => {
      finalModal.classList.remove("open");
      wornCrown.className = "visible";
      startMinigame();
    });

    // =========================================================================
    // CONTROLES PC (TECLADO) Y CELULAR (TÁCTILES)
    // =========================================================================
    window.addEventListener("keydown", (e) => {
      if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = true;
      if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = true;
      if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") {
        e.preventDefault();
        keys.jump = true;
      }
    });
    window.addEventListener("keyup", (e) => {
      if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
      if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
      if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") keys.jump = false;
    });

    function bindTouchBtn(btnId, keyName) {
      const el = document.getElementById(btnId);
      const press = (e) => {
        e.preventDefault();
        keys[keyName] = true;
        el.classList.add("pressed");
      };
      const release = (e) => {
        e.preventDefault();
        keys[keyName] = false;
        el.classList.remove("pressed");
      };
      el.addEventListener("pointerdown", press);
      el.addEventListener("pointerup", release);
      el.addEventListener("pointerleave", release);
      el.addEventListener("pointercancel", release);
    }
    bindTouchBtn("btn-left", "left");
    bindTouchBtn("btn-right", "right");
    bindTouchBtn("btn-jump", "jump");
  </script>
</body>
</html>
