<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Únicos — Storytelling 2D para Camelita ✨</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: #07070c; color: #f8fafc;
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
    }
    .font-royal { font-family: 'Cinzel', serif; }

    /* Fondos por sceneBg */
    #scene-bg {
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(circle at 50% 35%, #16142c 0%, #07070c 80%);
      transition: background 0.9s ease;
    }
    body.bg-night_stars #scene-bg { background: radial-gradient(circle at 50% 35%, #16142c 0%, #07070c 80%); }
    body.bg-dusk_road #scene-bg { background: linear-gradient(180deg, #1e1b4b 0%, #4c1d95 45%, #181024 85%, #07070c 100%); }
    body.bg-desert_warm #scene-bg { background: linear-gradient(180deg, #431407 0%, #9a3412 45%, #271310 85%, #0a0709 100%); }
    body.bg-scorching_sun #scene-bg { background: linear-gradient(180deg, #7c2d12 0%, #c2410c 40%, #451a03 80%, #140b07 100%); }
    body.bg-twilight_sparks #scene-bg { background: linear-gradient(180deg, #1e1b4b 0%, #581c87 48%, #1a0b2e 88%, #07070c 100%); }
    body.bg-magic_night #scene-bg { background: radial-gradient(circle at 50% 35%, #312e81 0%, #1e1b4b 50%, #07070c 92%); }
    body.bg-sunrise_transition #scene-bg { background: linear-gradient(180deg, #3b0764 0%, #be185d 45%, #fb923c 78%, #1f1024 100%); }
    body.bg-neon_galaxy_party #scene-bg { background: radial-gradient(circle at 50% 35%, #6b21a8 0%, #3b0764 52%, #07070c 94%); }
    body.bg-warm_sunrise #scene-bg { background: linear-gradient(180deg, #831843 0%, #f43f5e 45%, #fbbf24 82%, #23111c 100%); }
    body.bg-golden_desert #scene-bg { background: linear-gradient(180deg, #78350f 0%, #d97706 48%, #451a03 84%, #110b06 100%); }
    body.bg-pink_wind_storm #scene-bg { background: radial-gradient(circle at 50% 35%, #9d174d 0%, #500724 55%, #0e0610 95%); }

    #fx-canvas {
      position: fixed; inset: 0; width: 100%; height: 100%;
      z-index: 2; pointer-events: none;
    }

    .glass {
      background: rgba(14, 14, 24, 0.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(245, 208, 118, 0.34);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    /* Carretera Parallax inferior */
    .road-floor {
      position: fixed; bottom: 0; left: 0; right: 0; height: 138px; z-index: 4; pointer-events: none;
      background: linear-gradient(to top, rgba(12, 10, 20, 0.96) 0%, rgba(192, 132, 252, 0.14) 75%, transparent 100%);
      border-top: 2px solid rgba(245, 208, 118, 0.32);
    }
    .road-dashes {
      position: absolute; top: 24px; left: 0; width: 200%; height: 3px;
      background: repeating-linear-gradient(to right, rgba(245, 208, 118, 0.65) 0 28px, transparent 28px 64px);
    }
    .road-dashes.moving { animation: roadScroll 1.1s linear infinite; }
    @keyframes roadScroll { from { transform: translateX(0); } to { transform: translateX(-64px); } }

    /* Karaoke superior */
    #karaoke-box {
      position: fixed; top: 52px; left: 50%; transform: translateX(-50%);
      z-index: 32; width: 94%; max-width: 680px; text-align: center; pointer-events: none;
    }
    .k-word {
      display: inline-block; margin: 0 3px;
      color: rgba(255, 255, 255, 0.36);
      transition: color 0.1s ease, text-shadow 0.1s ease, transform 0.1s ease;
    }
    .k-word.done { color: #fde68a; text-shadow: 0 0 8px rgba(245, 208, 118, 0.45); }
    .k-word.active {
      color: #ffffff;
      text-shadow: 0 0 14px rgba(255, 126, 182, 0.95), 0 0 26px rgba(245, 208, 118, 0.8);
      transform: scale(1.07);
    }

    /* Props Escenográficos 2D */
    #props-layer {
      position: fixed; inset: 0; z-index: 8; pointer-events: none; overflow: hidden;
    }
    @keyframes windSweep {
      0% { transform: translateX(110vw) rotate(-8deg); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(-110vw) rotate(8deg); opacity: 0; }
    }
    .wind-gust {
      position: fixed; top: 32%; left: 0; font-size: 2.2rem; white-space: nowrap;
      animation: windSweep 1.6s linear infinite;
      filter: drop-shadow(0 0 14px rgba(244, 63, 94, 0.85));
    }

    /* Escenario de Personajes */
    #stage-actors {
      position: fixed; left: 0; right: 0; bottom: 120px; height: 240px;
      z-index: 16; display: flex; align-items: flex-end; justify-content: center; gap: 6px;
      pointer-events: none;
    }
    #stage-actors.shake-slow { animation: slowShake 0.45s ease-in-out infinite; }
    @keyframes slowShake {
      0%,100% { transform: translate(0, 0); }
      25% { transform: translate(-3px, 2px); }
      75% { transform: translate(3px, -2px); }
    }

    .actor-wrap {
      position: relative; display: flex; flex-direction: column; align-items: center;
      pointer-events: auto; cursor: pointer;
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.45s ease;
    }
    .name-badge {
      padding: 2px 12px; border-radius: 9999px; font-size: 0.76rem; font-weight: 700;
      color: #fff; background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(8px); border: 1px solid rgba(255, 215, 140, 0.6);
      box-shadow: 0 0 14px rgba(255, 126, 182, 0.55);
      margin-bottom: 2px; white-space: nowrap;
    }

    /* Animaciones de estados corporales */
    @keyframes fanMotion { 0%,100%{transform:rotate(-10deg);} 50%{transform:rotate(-55deg);} }
    .fanning-arm { transform-origin: 102px 104px; animation: fanMotion 0.35s ease-in-out infinite; }

    @keyframes hairBlow { 0%,100%{transform:skewX(0deg);} 50%{transform:skewX(-14deg);} }
    .hair-wind { transform-origin: 74px 40px; animation: hairBlow 0.3s ease-in-out infinite; }

    @keyframes danceParty {
      0%,100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-16px) rotate(3deg); }
    }
    .party-bounce { animation: danceParty 0.48s ease-in-out infinite; }

    @keyframes spin360 { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }
    .spin-now { animation: spin360 0.85s ease-in-out; }

    /* Botones de Reacciones en Vivo (abajo del escenario) */
    #reactions-bar {
      position: fixed; bottom: 52px; left: 50%; transform: translateX(-50%);
      z-index: 38; display: flex; gap: 10px;
    }
    .react-btn {
      width: 44px; height: 44px; border-radius: 50%; font-size: 1.15rem;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      transition: transform 0.12s ease;
    }
    .react-btn:active { transform: scale(0.88); }

    /* Scrubber inferior */
    #scrubber-wrap {
      position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%);
      width: 94%; max-width: 600px; z-index: 40;
      padding: 6px 12px; border-radius: 9999px;
      display: flex; align-items: center; gap: 8px;
    }
    .scrub-track {
      position: relative; flex: 1; height: 8px; border-radius: 9999px;
      background: rgba(255, 255, 255, 0.15); cursor: pointer;
    }
    .scrub-fill {
      height: 100%; width: 0%; border-radius: 9999px;
      background: linear-gradient(to right, #f5d076, #ff7eb6);
    }

    /* Ondas sonido */
    .waves { display: flex; align-items: flex-end; gap: 2px; height: 13px; }
    .waves span { width: 2.5px; height: 4px; background: linear-gradient(to top, #ff7eb6, #f5d076); border-radius: 2px; }
    .playing .waves span:nth-child(1) { animation: wv 0.6s infinite 0.0s; }
    .playing .waves span:nth-child(2) { animation: wv 0.6s infinite 0.2s; }
    .playing .waves span:nth-child(3) { animation: wv 0.6s infinite 0.35s; }
    @keyframes wv { 0%,100%{height:4px;} 50%{height:13px;} }

    /* Overlay Inicial & Modal ⚙️ */
    #start-overlay {
      position: fixed; inset: 0; z-index: 80;
      background: radial-gradient(circle at center, #141126 0%, #07070c 80%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 24px; transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #start-overlay.hidden-phase { opacity: 0; visibility: hidden; pointer-events: none; }

    .glow-btn {
      padding: 13px 26px; border-radius: 9999px; font-weight: 700; color: #fff;
      background: linear-gradient(135deg, rgba(245, 208, 118, 0.24), rgba(255, 126, 182, 0.3));
      border: 1.5px solid rgba(245, 208, 118, 0.85);
      box-shadow: 0 0 24px rgba(245, 208, 118, 0.35);
      cursor: pointer; transition: transform 0.15s ease;
    }
    .glow-btn:active { transform: scale(0.95); }

    .modal-backdrop {
      position: fixed; inset: 0; z-index: 90;
      background: rgba(6, 6, 12, 0.78); backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: center; padding: 18px;
      opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .modal-backdrop.open { opacity: 1; visibility: visible; }
  </style>
</head>

  <script>
    // =========================================================================
    // 👇 PEGA AQUÍ EL LINK O ARCHIVO DE TU MÚSICA (.mp3) 👇
    // =========================================================================
    const CONFIG = {
      musicUrl: "",
      // Desfase configurable por si el audio empieza directo en la voz o tras otra intro
      vocalStartOffset: 0.0,
      totalDuration: 125.0
    };

    const LYRICS_TIMELINE = [
      // ================= INTRO INSTRUMENTAL DE GUITARRA (0.00s - 14.00s) =================
      {
        start: 0.00, end: 4.50,
        lyric: "♪ (Intro de guitarra...) ♪",
        subLyric: "Sube el volumen y mira a Camelita ✨",
        actionState: "intro_guitar_vibe",
        sceneBg: "night_stars",
        animationDetail: "Camelita aparece en el centro con su nombre '✨ Camelita ✨' flotando arriba, moviendo la cabecita al ritmo de la guitarra junto al gatito 2D que toca una mini guitarra."
      },
      {
        start: 4.50, end: 9.50,
        lyric: "♪ ... ♪",
        subLyric: "Preparando el camino...",
        actionState: "intro_start_walking",
        sceneBg: "dusk_road",
        animationDetail: "Se enciende el sendero bajo los pies de Camelita; ella se levanta y empieza a caminar con pasos rítmicos sincronizados con la batería."

    // =========================================================================
    // CANVAS + WEB AUDIO ANALYSER
    // =========================================================================
    const canvas = document.getElementById("fx-canvas");
    const ctx = canvas.getContext("2d");
    let cw = 0, ch = 0;
    const stars = Array.from({ length: 75 }, () => ({ x: Math.random(), y: Math.random(), r: 0.8 + Math.random() * 2, p: Math.random() * 6 }));
    const fx = [];

    function resize() { cw = canvas.width = window.innerWidth; ch = canvas.height = window.innerHeight; }
    window.addEventListener("resize", resize);
    resize();

    function spawnFx(x, y, count, kind = "heart") {
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = kind === "petal" || kind === "gold" ? 1 + Math.random() * 2.6 : 2 + Math.random() * 4.5;
        fx.push({
          x, y,
          vx: kind === "petal" ? -2 - Math.random() * 2.5 : kind === "gold" ? (Math.random() - 0.5) * 1.4 : Math.cos(a) * sp,
          vy: kind === "petal" || kind === "gold" ? 1.8 + Math.random() * 2.6 : Math.sin(a) * sp - 1.4,
          life: 1, decay: kind === "petal" || kind === "gold" ? 0.008 : 0.02,
          kind, size: 6 + Math.random() * 7
        });
      }
    }

    function drawCanvas(now) {
      ctx.clearRect(0, 0, cw, ch);
      const t = now * 0.002;
      stars.forEach((s) => {
        ctx.fillStyle = `rgba(255,255,255,${0.2 + 0.55 * Math.sin(t + s.p)})`;
        ctx.beginPath(); ctx.arc(s.x * cw, s.y * ch, s.r, 0, Math.PI * 2); ctx.fill();
      });
      for (let i = fx.length - 1; i >= 0; i--) {
        const p = fx[i];
        p.x += p.vx; p.y += p.vy;
        if (p.kind === "heart" || p.kind === "note") p.vy += 0.06;
        p.life -= p.decay;
        if (p.life <= 0) { fx.splice(i, 1); continue; }
        ctx.save(); ctx.globalAlpha = p.life;
        ctx.fillStyle = p.kind === "petal" ? "#e11d48" : p.kind === "gold" ? "#f5d076" : "#ff7eb6";
        if (p.kind === "note") { ctx.font = "16px sans-serif"; ctx.fillText("♪", p.x, p.y); }
        else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.45, 0, Math.PI * 2); ctx.fill(); }
        ctx.restore();
      }
    }

    const audio = document.getElementById("bg-music");
    let audioCtx = null, analyser = null, freqData = null;
    function setupAnalyser() {
      try {
        if (audioCtx) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();
        const src = audioCtx.createMediaElementSource(audio);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;
        freqData = new Uint8Array(analyser.frequencyBinCount);
        src.connect(analyser);
        analyser.connect(audioCtx.destination);
      } catch {}
    }

    function getBeatEnergy(t) {
      if (analyser && useAudio && !audio.paused) {
        analyser.getByteFrequencyData(freqData);
        const bass = (freqData[0] + freqData[1] + freqData[2]) / (3 * 255);
        return bass;
      }
      return Math.abs(Math.sin(t * 7.2)) * 0.65;
    }

    function blockStart(b) { return b.start >= 14.0 ? Math.max(0, b.start + CONFIG.vocalStartOffset) : b.start; }
    function blockEnd(b) { return b.end >= 14.0 ? Math.max(0.5, b.end + CONFIG.vocalStartOffset) : b.end; }

    function setPropsForState(st) {
      let html = "";
      if (st === "intro_look_horizon" || st === "twenty_miles_heat" || st === "walk_heat_together") {
        html += `<div class="fixed top-28 right-6 text-6xl animate-pulse drop-shadow-[0_0_24px_rgba(251,146,60,0.95)]">☀️</div>`;
      }

      }
      if (st === "no_return_road") {
        html += `<div class="fixed bottom-[152px] left-5 glass rounded-xl px-3 py-1 text-xs font-bold text-rose-200 border border-rose-400/60">NO RETORNO ↩️🚫</div>`;

      if (st === "something_between_us") {

      if (st === "no_lonely_sunrise" || st === "hold_hands_jump" || st === "lean_shoulder_sunrise" || st === "warm_hug_sunrise" || st === "climax_flying_sunrise") {

      if (st === "love_gust_tornado") {

    function renderAt(t) {
      scrubTime.textContent = `${t.toFixed(1)}s`;
      clockText.textContent = `${t.toFixed(2)}s`;
      scrubFill.style.width = `${Math.min(100, (t / CONFIG.totalDuration) * 100)}%`;

      let bIdx = 0;
      for (let i = 0; i < LYRICS_TIMELINE.length; i++) {
        if (t >= blockStart(LYRICS_TIMELINE[i])) bIdx = i;
      }
      const b = LYRICS_TIMELINE[bIdx];
      const st = performance.now() < manualBoostUntil ? manualAction : b.actionState;

      if (bIdx !== curIdx) {
        curIdx = bIdx;
        document.body.className = `bg-${b.sceneBg}`;
        karaokeMain.innerHTML = b.lyric.split(" ").map((w) => `<span class="k-word">${w}</span>`).join(" ");
        karaokeSub.textContent = b.subLyric || "";
        setPropsForState(b.actionState);
      }

      // Karaoke palabra por palabra
      const bs = blockStart(b), be = blockEnd(b);
      const frac = Math.max(0, Math.min(1, (t - bs) / Math.max(0.1, be - bs)));
      const wEls = karaokeMain.querySelectorAll(".k-word");
      const activeW = Math.floor(frac * wEls.length);
      wEls.forEach((el, idx) => {
        el.classList.toggle("done", idx < activeW);
        el.classList.toggle("active", idx === activeW);
      });

      const beat = getBeatEnergy(t);
      const bounce = beat * 8;

      // Reset props de personajes
      camFan.setAttribute("opacity", "0");
      camCocktail.setAttribute("opacity", "0");
      boyCocktail.setAttribute("opacity", "0");
      boySweat.setAttribute("opacity", "0");
      camSweat.setAttribute("opacity", "0");
      boyCloud.setAttribute("opacity", "0");
      camTongue.setAttribute("opacity", "0");
      camStars.setAttribute("opacity", "0");
      camClosedR.setAttribute("opacity", "0");
      camBlush.setAttribute("opacity", "0.55");
      camArmR.classList.remove("fanning-arm");
      camHair.classList.remove("hair-wind");
      stageActors.classList.remove("shake-slow");
      roadDashes.classList.remove("moving");
      catProp.textContent = st === "intro_guitar_vibe" ? "🎸" : st === "twenty_miles_heat" ? "🥵" : "✨";

      // Chico visible desde 21.0s
      if (t >= 21.0) {
        charBoy.style.opacity = "1";
        charBoy.style.transform = st === "warm_hug_sunrise" || st === "outro_wave_and_hug" || st === "sweet_forehead_touch" ? "translateX(14px)" : "translateX(0px)";
      } else {
        charBoy.style.opacity = "0";
        charBoy.style.transform = "translateX(-90px)";
      }

      // Caminata / Baile / Posturas
      camSvg.style.transform = `translateY(${-bounce}px)`;
      charCat.style.transform = `translateY(${-bounce * 1.3}px)`;

      if (st === "intro_start_walking" || st === "no_return_road" || st === "walk_heat_together" || st === "climax_walk_hearts") {
        roadDashes.classList.add("moving");
        camLegL.style.transform = `rotate(${Math.sin(t * 10) * 18}deg)`;
        camLegR.style.transform = `rotate(${-Math.sin(t * 10) * 18}deg)`;
      } else {
        camLegL.style.transform = "rotate(0deg)";
        camLegR.style.transform = "rotate(0deg)";
      }

      if (st === "twenty_miles_heat") {
        camFan.setAttribute("opacity", "1");
        camTongue.setAttribute("opacity", "1");
        camArmR.classList.add("fanning-arm");
      } else if (st === "sweat_liquor_and_dust") {
        camCocktail.setAttribute("opacity", "1");
        boyCocktail.setAttribute("opacity", "1");
        boySweat.setAttribute("opacity", "1");
        camSweat.setAttribute("opacity", "1");
      } else if (st === "see_you_again_eyes" || st === "face_to_face_blush") {

        if (Math.random() < 0.28) spawnFx(Math.random() * cw, -10, 1, "heart");

        camArmL.style.transform = `rotate(${65 + Math.sin(t * 11) * 35}deg)`;
        camArmR.style.transform = `rotate(${-65 - Math.sin(t * 11) * 35}deg)`;

      if (!useAudio || audio.paused) virtualT += dt;
      const cur = useAudio && !audio.paused ? audio.currentTime : virtualT;
      renderAt(Math.min(CONFIG.totalDuration, cur));
    }
    requestAnimationFrame(loop);

    // Inicio y controles
    document.getElementById("btn-start").addEventListener("click", async () => {
      document.getElementById("start-overlay").classList.add("hidden-phase");
      running = true;
      lastNow = performance.now();
      if (CONFIG.musicUrl) {
        audio.src = CONFIG.musicUrl;
        setupAnalyser();
        try {
          if (audioCtx && audioCtx.state === "suspended") await audioCtx.resume();
          await audio.play();
          useAudio = true;
          document.getElementById("play-label").textContent = "⏸";
          document.getElementById("btn-play").classList.add("playing");
        } catch { useAudio = false; }
      }
    });

    document.getElementById("btn-play").addEventListener("click", async () => {
      if (!running) return;
      paused = !paused;
      if (paused) {
        if (useAudio) audio.pause();
        document.getElementById("play-label").textContent = "▶";
        document.getElementById("btn-play").classList.remove("playing");
      } else {
        lastNow = performance.now();
        if (useAudio) await audio.play().catch(() => {});
        document.getElementById("play-label").textContent = "⏸";
        document.getElementById("btn-play").classList.add("playing");
      }
    });

    // Toques al ritmo en pantalla / personajes
    window.addEventListener("pointerdown", (e) => {
      if (!running || e.target.closest("button, input, .modal-backdrop, #scrubber-wrap")) return;
      spawnFx(e.clientX, e.clientY, 12, Math.random() < 0.5 ? "heart" : "note");
      camClosedL.setAttribute("opacity", "1");
      setTimeout(() => camClosedL.setAttribute("opacity", "0"), 260);
    });

    // 4 Botones de reacciones en vivo
    function triggerManual(action, ms = 2200) {
      manualAction = action;
      manualBoostUntil = performance.now() + ms;
      setPropsForState(action);
    }
    document.getElementById("react-heat").addEventListener("click", () => triggerManual("twenty_miles_heat"));
    document.getElementById("react-gust").addEventListener("click", () => triggerManual("love_gust_tornado"));
    document.getElementById("react-toast").addEventListener("click", () => triggerManual("sweat_liquor_and_dust"));
    document.getElementById("react-dance").addEventListener("click", () => {
      camWrap.classList.remove("spin-now");
      void camWrap.offsetWidth;
      camWrap.classList.add("spin-now");
      spawnFx(cw / 2, ch * 0.6, 20, "heart");
    });

    // Scrubber
    document.getElementById("scrub-track").addEventListener("click", (e) => {
      if (!running) return;
      const r = e.currentTarget.getBoundingClientRect();
      const targetT = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * CONFIG.totalDuration;
      virtualT = targetT;
      if (useAudio) audio.currentTime = targetT;
      renderAt(targetT);
    });

    // Modal ⚙️
    const cfgModal = document.getElementById("cfg-modal");
    document.getElementById("btn-cfg").addEventListener("click", () => {
      document.getElementById("inp-url").value = CONFIG.musicUrl;
      document.getElementById("offset-label").textContent = `Offset de voz actual: ${CONFIG.vocalStartOffset.toFixed(2)}s`;
      cfgModal.classList.add("open");
    });
    document.getElementById("btn-close-cfg").addEventListener("click", () => cfgModal.classList.remove("open"));
    document.getElementById("btn-sync-voice").addEventListener("click", () => {
      const cur = useAudio && !audio.paused ? audio.currentTime : virtualT;
      CONFIG.vocalStartOffset = cur - 14.0;
      document.getElementById("offset-label").textContent = `Sincronizado ✅ Offset: ${CONFIG.vocalStartOffset.toFixed(2)}s`;
    });
    document.getElementById("btn-apply-cfg").addEventListener("click", async () => {
      const url = document.getElementById("inp-url").value.trim();
      CONFIG.musicUrl = url;
      if (url) {
        audio.src = url;
        setupAnalyser();
        audio.currentTime = virtualT;
        await audio.play().then(() => { useAudio = true; }).catch(() => {});
      }
      cfgModal.classList.remove("open");
    });
  </script>
</body>
</html>
