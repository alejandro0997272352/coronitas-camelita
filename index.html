<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Únicos — Camelita 👑 (14 de Noviembre)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: #07070c; color: #f8fafc;
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
    }
    .font-royal { font-family: 'Cinzel', serif; }

    /* Fondos dinámicos según bgTheme */
    #bg-gradient {
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(circle at 50% 35%, #16142c 0%, #07070c 78%);
      transition: background 1.1s ease;
    }
    body.theme-night_sparkles #bg-gradient { background: radial-gradient(circle at 50% 35%, #16142c 0%, #07070c 78%); }
    body.theme-warm_dusk #bg-gradient { background: radial-gradient(circle at 50% 40%, #3b2438 0%, #140f1d 70%, #07070c 100%); }
    body.theme-sunset_heat #bg-gradient { background: linear-gradient(180deg, #431407 0%, #7c2d12 35%, #1c1018 80%, #09070c 100%); }
    body.theme-twilight_magic #bg-gradient { background: linear-gradient(180deg, #1e1b4b 0%, #4c1d95 45%, #130c1f 85%, #07070c 100%); }
    body.theme-sunrise_pink #bg-gradient { background: linear-gradient(180deg, #500724 0%, #9d174d 38%, #f472b6 68%, #1e1024 100%); }
    body.theme-neon_purple_party #bg-gradient { background: radial-gradient(circle at 50% 35%, #581c87 0%, #2e1065 48%, #07070c 92%); }
    body.theme-golden_hour #bg-gradient { background: linear-gradient(180deg, #451a03 0%, #92400e 42%, #1e140c 85%, #07070c 100%); }
    body.theme-crimson_roses #bg-gradient { background: radial-gradient(circle at 50% 35%, #881337 0%, #4c0519 48%, #09060c 92%); }
    body.theme-royal_gold #bg-gradient { background: radial-gradient(circle at 50% 30%, #78350f 0%, #3b1c0a 42%, #0a0812 90%); }

    #fx-canvas {
      position: fixed; inset: 0; width: 100%; height: 100%;
      z-index: 2; pointer-events: none;
    }

    .glass {
      background: rgba(14, 14, 24, 0.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(245, 208, 118, 0.34);
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.5);
    }

    /* Suelo luminoso */
    .stage-floor {
      position: fixed; bottom: 0; left: 0; right: 0; height: 148px; z-index: 3; pointer-events: none;
      background: linear-gradient(to top, rgba(10, 8, 18, 0.96) 0%, rgba(192, 132, 252, 0.14) 75%, transparent 100%);
      border-top: 1.5px solid rgba(245, 208, 118, 0.28);
    }

    /* Karaoke superior */
    #karaoke-wrap {
      position: fixed; top: 56px; left: 50%; transform: translateX(-50%);
      z-index: 30; width: 94%; max-width: 680px; text-align: center;
      pointer-events: none; padding: 6px 12px;
    }
    .k-word {
      display: inline-block; margin: 0 3px;
      color: rgba(255, 255, 255, 0.36);
      transition: color 0.1s ease, text-shadow 0.1s ease, transform 0.1s ease;
    }
    .k-word.done { color: #fde68a; text-shadow: 0 0 8px rgba(245, 208, 118, 0.45); }
    .k-word.active {
      color: #ffffff;
      text-shadow: 0 0 14px rgba(255, 126, 182, 0.95), 0 0 26px rgba(245, 208, 118, 0.75);
      transform: scale(1.06);
    }

    /* Escenario de Personajes 2D */
    #stage-actors {
      position: fixed; left: 0; right: 0; bottom: 132px; height: 240px;
      z-index: 15; display: flex; align-items: flex-end; justify-content: center;
      pointer-events: none;
    }
    #stage-actors.shake { animation: screenShake 0.4s ease-in-out infinite; }
    @keyframes screenShake {
      0%,100% { transform: translate(0, 0); }
      25% { transform: translate(-2px, 1px); }
      75% { transform: translate(2px, -1px); }
    }

    .actor-box {
      position: relative; display: flex; flex-direction: column; align-items: center;
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s ease;
      pointer-events: auto; cursor: pointer;
    }

    .name-badge {
      padding: 2px 12px; border-radius: 9999px; font-size: 0.76rem; font-weight: 700;
      color: #fff; background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(8px); border: 1px solid rgba(255, 215, 140, 0.6);
      box-shadow: 0 0 14px rgba(255, 126, 182, 0.55);
      margin-bottom: 2px; white-space: nowrap;
    }

    #camelita-crown-slot {
      width: 52px; height: 32px; display: flex; align-items: center; justify-content: center;
      margin-bottom: -11px; z-index: 20; border-radius: 9999px;
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }
    #camelita-crown-slot.drag-hover {
      background: rgba(245, 208, 118, 0.3);
      box-shadow: 0 0 22px rgba(245, 208, 118, 0.9);
    }

    /* Corona flotante de Compuerta 4.5s */
    #intro-crown-drag {
      position: fixed; top: 27%; left: 50%; margin-left: -38px;
      width: 76px; height: 54px; z-index: 45; cursor: grab; touch-action: none;
      filter: drop-shadow(0 0 20px rgba(245, 208, 118, 0.95));
      display: none;
    }
    #intro-crown-drag.visible { display: block; animation: floatY 1.8s ease-in-out infinite; }
    #intro-crown-drag.dragging { animation: none; cursor: grabbing; transform: scale(1.15); z-index: 95; }
    @keyframes floatY { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-9px);} }

    /* Props 2D */
    #scene-props {
      position: fixed; inset: 0; z-index: 8; pointer-events: none;
    }

    /* Exhibidor inferior de 4 Coronitas */
    #crowns-dock {
      position: fixed; bottom: 54px; left: 50%; transform: translateX(-50%);
      z-index: 38; display: flex; gap: 8px; padding: 6px 10px; border-radius: 9999px;
    }
    .dock-crown-btn {
      width: 44px; height: 44px; border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 1.1rem; cursor: pointer; touch-action: none;
      border: 1px solid rgba(245, 208, 118, 0.35);
      background: rgba(255, 255, 255, 0.06);
      opacity: 0.35; transition: opacity 0.3s ease, transform 0.2s ease, background 0.3s ease;
    }
    .dock-crown-btn.unlocked {
      opacity: 1; background: rgba(245, 208, 118, 0.2);
      box-shadow: 0 0 14px rgba(255, 126, 182, 0.45);
    }
    .dock-crown-btn.unlocked:active { transform: scale(0.92); }

    /* Scrubber inferior */
    #scrubber-wrap {
      position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
      width: 94%; max-width: 600px; z-index: 40;
      padding: 6px 12px; border-radius: 9999px;
      display: flex; align-items: center; gap: 8px;
    }
    .scrub-track {
      position: relative; flex: 1; height: 8px; border-radius: 9999px;
      background: rgba(255, 255, 255, 0.14); cursor: pointer;
    }
    .scrub-fill {
      height: 100%; width: 0%; border-radius: 9999px;
      background: linear-gradient(to right, #f5d076, #ff7eb6);
    }

    /* Ondas audio */
    .waves { display: flex; align-items: flex-end; gap: 2px; height: 13px; }
    .waves span { width: 2.5px; height: 4px; background: linear-gradient(to top, #ff7eb6, #f5d076); border-radius: 2px; }
    .playing .waves span:nth-child(1) { animation: wv 0.6s infinite 0.0s; }
    .playing .waves span:nth-child(2) { animation: wv 0.6s infinite 0.2s; }
    .playing .waves span:nth-child(3) { animation: wv 0.6s infinite 0.35s; }
    @keyframes wv { 0%,100%{height:4px;} 50%{height:13px;} }

    /* Overlay Inicial & Modales */
    #start-overlay {
      position: fixed; inset: 0; z-index: 80;
      background: radial-gradient(circle at center, #141126 0%, #07070c 80%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 24px; transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #start-overlay.hidden-phase { opacity: 0; visibility: hidden; pointer-events: none; }

    .glow-btn {
      padding: 13px 26px; border-radius: 9999px; font-weight: 700; color: #fff;
      background: linear-gradient(135deg, rgba(245, 208, 118, 0.24), rgba(255, 126, 182, 0.3));
      border: 1.5px solid rgba(245, 208, 118, 0.85);
      box-shadow: 0 0 24px rgba(245, 208, 118, 0.35);
      cursor: pointer; transition: transform 0.15s ease;
    }
    .glow-btn:active { transform: scale(0.95); }

    .modal-backdrop {
      position: fixed; inset: 0; z-index: 90;
      background: rgba(6, 6, 12, 0.78); backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: center; padding: 18px;
      opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .modal-backdrop.open { opacity: 1; visibility: visible; }
  </style>
</head>
<body class="theme-night_sparkles">

  <div id="bg-gradient"></div>
  <canvas id="fx-canvas"></canvas>
  <div id="scene-props"></div>
  <div class="stage-floor"></div>

  <!-- HUD Superior Izquierdo -->
  <div class="fixed top-2.5 left-2.5 z-40 glass rounded-2xl px-3 py-1.5 flex items-center gap-2">
    <span class="text-[11px] sm:text-xs font-bold text-amber-200">Coronitas de Camelita: <span id="hud-count" class="text-pink-300">0 / 4 👑</span></span>
  </div>

  <!-- Controles Superiores Derechos -->
  <div class="fixed top-2.5 right-2.5 z-50 flex items-center gap-1.5">
    <span id="clock-badge" class="glass rounded-full px-2.5 py-1 text-[11px] font-mono text-cyan-300">00.00s</span>
    <button id="btn-play" class="glass rounded-full px-3 py-1.5 flex items-center gap-1.5 text-xs font-semibold text-amber-100 cursor-pointer">

      <span id="play-label">▶</span>
    </button>
    <button id="btn-cfg" class="glass rounded-full w-8 h-8 flex items-center justify-center text-sm cursor-pointer" title="Música y Ajuste de Voz">⚙️</button>
  </div>
  <audio id="bg-music" crossorigin="anonymous" preload="auto"></audio>

  <!-- Karaoke Palabra por Palabra -->
  <div id="karaoke-wrap">
    <p id="karaoke-main" class="font-royal text-base sm:text-xl font-bold leading-snug"></p>
    <p id="karaoke-sub" class="text-xs sm:text-sm text-pink-200/90 mt-1 font-medium"></p>
  </div>

  <!-- Corona Arrastrable Inicial (4.5s - 9.5s) -->
  <svg id="intro-crown-drag" viewBox="0 0 100 70" fill="none">
    <defs>
      <linearGradient id="cGold" x1="0" y1="0" x2="100" y2="70" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#fde68a"/><stop offset="50%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#fef08a"/>
      </linearGradient>
    </defs>
    <path d="M12 56 L6 20 L30 38 L50 10 L70 38 L94 20 L88 56 Z" fill="url(#cGold)" stroke="#fff7ed" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="12" y="54" width="76" height="8" rx="4" fill="#d97706" stroke="#fff7ed" stroke-width="2"/>
    <circle cx="50" cy="10" r="4.5" fill="#ff7eb6"/>
  </svg>

  <!-- Escenario de Personajes 2D (#char-boy, #char-camelita, #char-cat) -->
  <div id="stage-actors">
    <!-- Chico 2D (#char-boy) -->
    <div id="char-boy" class="actor-box" style="opacity:0; transform: translateX(-80px); margin-right:-6px;">
      <svg id="boy-svg" width="108" height="154" viewBox="0 0 130 180" fill="none">
        <g id="boy-legs">
          <rect x="46" y="130" width="13" height="36" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
          <rect x="71" y="130" width="13" height="36" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
        </g>
        <g id="boy-arms">
          <path id="boy-arm-l" d="M38 96 C26 110 26 126 34 130 C40 132 45 120 46 106 Z" fill="#312e81" stroke="#1e1b4b" stroke-width="2"/>
          <path id="boy-arm-r" d="M92 96 C104 110 104 126 96 130 C90 132 85 120 84 106 Z" fill="#312e81" stroke="#1e1b4b" stroke-width="2"/>
        </g>
        <path d="M40 92 C38 86 92 86 90 92 L95 134 C95 139 35 139 35 134 Z" fill="#3730a3" stroke="#1e1b4b" stroke-width="2.2"/>
        <ellipse cx="65" cy="58" rx="30" ry="29" fill="#d49b78" stroke="#2d1e17" stroke-width="2.2"/>
        <path d="M34 52 C34 26 96 26 96 52 C86 38 74 42 65 36 C55 42 44 38 34 52 Z" fill="#18141c"/>
        <ellipse cx="53" cy="60" rx="5.5" ry="7" fill="#141016"/>
        <ellipse cx="77" cy="60" rx="5.5" ry="7" fill="#141016"/>
        <circle cx="55" cy="57" r="2" fill="#fff"/>
        <circle cx="79" cy="57" r="2" fill="#fff"/>
        <path d="M60 73 Q65 77 70 73" stroke="#4a281d" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      </svg>
    </div>

    <!-- Protagonista: Camelita (#char-camelita) -->
    <div id="char-camelita" class="actor-box">
      <div class="name-badge">✨ Camelita ✨</div>
      <div id="camelita-crown-slot">
        <svg id="worn-crown" width="46" height="32" viewBox="0 0 100 70" fill="none" style="opacity:0; transition: opacity 0.35s ease, filter 0.35s ease;">
          <path d="M12 56 L6 20 L30 38 L50 10 L70 38 L94 20 L88 56 Z" fill="url(#cGold)" stroke="#fff7ed" stroke-width="2.5"/>
          <rect x="12" y="54" width="76" height="8" rx="4" fill="#d97706" stroke="#fff7ed" stroke-width="2"/>
          <circle id="worn-gem" cx="50" cy="10" r="5" fill="#38bdf8"/>
        </svg>
      </div>

      <svg id="camelita-svg" width="124" height="162" viewBox="0 0 148 190" fill="none">
        <g id="cam-hair">
          <path d="M36 52 C28 84 26 122 34 142 C46 146 102 146 114 142 C122 122 120 84 112 52 C102 24 46 24 36 52 Z" fill="#18141c" stroke="#0b090e" stroke-width="2.5"/>
        </g>
        <!-- Pantalón azul marino -->
        <g id="cam-legs">
          <g id="cam-leg-l">
            <rect x="54" y="138" width="14" height="34" rx="7" fill="#1e3a5f" stroke="#0f172a" stroke-width="2"/>
            <path d="M51 168 C51 164 69 164 70 172 C70 176 50 176 51 168 Z" fill="#111827"/>
          </g>
          <g id="cam-leg-r">
            <rect x="80" y="138" width="14" height="34" rx="7" fill="#1e3a5f" stroke="#0f172a" stroke-width="2"/>

            <circle cx="38" cy="137" r="6" fill="#c68b67" stroke="#2d1e17" stroke-width="1.8"/>
          </g>
          <g id="cam-arm-r">
            <path d="M102 102 C116 114 120 132 112 138 C106 142 98 132 96 116 Z" fill="#14141d" stroke="#2e2e3d" stroke-width="2"/>
            <circle cx="110" cy="137" r="6" fill="#c68b67" stroke="#2d1e17" stroke-width="1.8"/>

        </g>
        <!-- Buzo / Hoodie negro -->
        <path d="M46 98 C44 92 104 92 102 98 L108 142 C108 148 40 148 40 142 Z" fill="#161620" stroke="#323244" stroke-width="2.2"/>

        <!-- Rosa / Corazón en las manos -->
        <text id="cam-prop-emoji" x="74" y="128" text-anchor="middle" font-size="24" opacity="0">🌹</text>
        <!-- Cabeza -->
        <g id="cam-head">
          <ellipse cx="74" cy="64" rx="33" ry="31" fill="#c68b67" stroke="#2d1e17" stroke-width="2.2"/>
          <path d="M40 56 C42 32 106 32 108 56 C96 44 84 48 74 42 C64 48 52 44 40 56 Z" fill="#18141c"/>
          <g id="cam-eyes-open">
            <ellipse cx="60" cy="66" rx="6.5" ry="8" fill="#141016"/>
            <ellipse cx="88" cy="66" rx="6.5" ry="8" fill="#141016"/>
            <circle cx="62" cy="63" r="2.4" fill="#fff"/>
            <circle cx="90" cy="63" r="2.4" fill="#fff"/>
          </g>
          <g id="cam-eyes-stars" opacity="0">
            <text x="55" y="70" font-size="12" fill="#fde68a">✦</text>
            <text x="83" y="70" font-size="12" fill="#fde68a">✦</text>
          </g>

          <path id="cam-eye-closed-r" d="M81 66 Q88 60 95 66" stroke="#141016" stroke-width="2.6" stroke-linecap="round" fill="none" opacity="0"/>
          <g id="cam-blush" opacity="0.55">
            <ellipse cx="50" cy="75" rx="6" ry="3.2" fill="#f472b6"/>

          </g>
          <path d="M69 80 Q74 85 79 80" stroke="#4a281d" stroke-width="2.4" stroke-linecap="round" fill="none"/>
        </g>
      </svg>
    </div>

    <!-- Gatito Compañero 2D (#char-cat) -->
    <div id="char-cat" class="actor-box" style="opacity:0; margin-left:-4px;">
      <svg id="cat-svg" width="58" height="68" viewBox="0 0 70 80" fill="none">

        <path d="M22 18 L20 6 L30 13 L35 3 L40 13 L50 6 L48 18 Z" fill="#a855f7" stroke="#f5d076" stroke-width="1.5"/>

        <polygon points="40,22 46,14 52,22" fill="#f1f5f9" stroke="#1e293b" stroke-width="2"/>

        <circle cx="35" cy="32" r="15" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
        <circle cx="29" cy="31" r="2.5" fill="#0f172a"/>
        <circle cx="41" cy="31" r="2.5" fill="#0f172a"/>
        <path d="M32 36 Q35 39 38 36" stroke="#f472b6" stroke-width="2" stroke-linecap="round" fill="none"/>
        <path d="M50 58 Q64 48 60 36" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Sobre Real Final -->
  <button id="btn-final-envelope" class="hidden fixed bottom-[132px] right-4 sm:right-12 z-35 glass rounded-2xl px-3.5 py-2 flex flex-col items-center animate-bounce cursor-pointer">
    <span class="text-3xl">💌</span>
    <span class="text-[10px] font-royal text-amber-200">Nota Final</span>
  </button>

  <!-- Exhibidor Interactivo de las 4 Coronitas (abajo) -->
  <div id="crowns-dock" class="glass">
    <button class="dock-crown-btn" data-c="0" title="Corona 1: Diamantes">👑</button>
    <button class="dock-crown-btn" data-c="1" title="Corona 2: Oscura Morada">👑</button>
    <button class="dock-crown-btn" data-c="2" title="Corona 3: Rosas Rojas">👑</button>
    <button class="dock-crown-btn" data-c="3" title="Corona 4: Imperial">👑</button>
  </div>

  <!-- Barra Scrubber con Marcadores de Versos -->
  <div id="scrubber-wrap" class="glass">
    <span id="scrub-time" class="text-[11px] font-mono text-amber-200 min-w-[38px]">0.0s</span>
    <div class="scrub-track" id="scrub-track">
      <div class="scrub-fill" id="scrub-fill"></div>
    </div>
    <span class="text-[11px] font-mono text-slate-300">125s</span>
  </div>

  <!-- Pantalla de Inicio -->
  <div id="start-overlay">
    <div class="text-5xl mb-3 animate-pulse">👑</div>
    <p class="font-royal text-xs tracking-[0.26em] uppercase text-amber-200/75 mb-2">14 de Noviembre • Siddhartha - Únicos</p>
    <h1 class="font-royal text-2xl sm:text-3xl font-bold text-white mb-6">Para Camelita ✨</h1>
    <button id="btn-start" class="glow-btn">Tocar para Comenzar 💗</button>
  </div>

  <!-- Modal Tarjeta de Corona -->
  <div id="crown-modal" class="modal-backdrop">
    <div class="glass rounded-3xl w-full max-w-sm overflow-hidden text-center">
      <div class="relative h-48 bg-black">
        <img id="cm-img" src="" alt="Corona" class="w-full h-full object-cover" />
        <div class="absolute inset-0 bg-gradient-to-t from-[#0e0e18] via-transparent to-transparent"></div>
        <span id="cm-badge" class="absolute top-3 left-3 text-[10px] font-royal uppercase tracking-widest px-3 py-1 rounded-full bg-black/70 border border-amber-200/40 text-amber-200"></span>
      </div>
      <div class="p-5">
        <h3 id="cm-title" class="font-royal text-lg font-bold text-amber-200 mb-2"></h3>
        <p id="cm-msg" class="text-xs sm:text-sm text-slate-200 leading-relaxed mb-4"></p>
        <div class="flex gap-2 justify-center">
          <button id="cm-equip" class="glow-btn text-xs px-4 py-2">Ponerle a Camelita 👑</button>
          <button id="cm-close" class="glass rounded-full text-xs px-4 py-2 cursor-pointer">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Carta Final -->
  <div id="final-modal" class="modal-backdrop">

    // =========================================================================
    // CANVAS DE PARTÍCULAS Y REACCIÓN AL RITMO
    // =========================================================================
    const canvas = document.getElementById("fx-canvas");
    const ctx = canvas.getContext("2d");
    let cw = 0, ch = 0;
    const stars = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random(), r: 0.8 + Math.random() * 2, p: Math.random() * 6 }));
    const fxParticles = [];

    function resize() { cw = canvas.width = window.innerWidth; ch = canvas.height = window.innerHeight; }
    window.addEventListener("resize", resize);
    resize();

    function spawnFx(x, y, count, kind = "heart") {
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = kind === "petal" || kind === "gold" || kind === "diamond" ? 1 + Math.random() * 2.5 : 2 + Math.random() * 4.5;
        fxParticles.push({
          x, y,
          vx: kind === "petal" ? -1.5 - Math.random() * 2 : kind === "gold" || kind === "diamond" ? (Math.random() - 0.5) * 1.4 : Math.cos(a) * sp,
          vy: kind === "petal" || kind === "gold" || kind === "diamond" ? 1.8 + Math.random() * 2.5 : Math.sin(a) * sp - 1.5,
          life: 1, decay: kind === "petal" || kind === "gold" ? 0.008 : 0.02,
          kind, size: 6 + Math.random() * 7
        });
      }
    }

    function drawCanvas(nowMs) {
      ctx.clearRect(0, 0, cw, ch);
      const t = nowMs * 0.002;
      stars.forEach((s) => {
        ctx.fillStyle = `rgba(255, 255, 255, ${0.2 + 0.55 * Math.sin(t + s.p)})`;
        ctx.beginPath(); ctx.arc(s.x * cw, s.y * ch, s.r, 0, Math.PI * 2); ctx.fill();
      });
      for (let i = fxParticles.length - 1; i >= 0; i--) {
        const p = fxParticles[i];
        p.x += p.vx; p.y += p.vy;
        if (p.kind === "heart" || p.kind === "note") p.vy += 0.06;
        p.life -= p.decay;
        if (p.life <= 0) { fxParticles.splice(i, 1); continue; }
        ctx.save(); ctx.globalAlpha = p.life;
        ctx.fillStyle = p.kind === "petal" ? "#e11d48" : p.kind === "gold" ? "#f5d076" : p.kind === "diamond" ? "#7dd3fc" : "#ff7eb6";
        if (p.kind === "note") {
          ctx.font = "16px sans-serif";
          ctx.fillText("♪", p.x, p.y);
        } else {
          ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.44, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
      }
    }

    window.addEventListener("pointerup", (e) => {

      draggingIntroCrown = false;

    // Props 2D por estado
    function renderSceneProps(state) {
      let html = "";
      if (state === "walk_desert_heat" || state === "endless_star_road") {
        html = `<div class="fixed top-28 right-8 text-6xl animate-pulse drop-shadow-[0_0_24px_rgba(251,146,60,0.9)]">☀️</div>`;
      } else if (state === "cocktail_toast_dust") {
        html = `<div class="fixed bottom-[230px] left-1/2 -translate-x-1/2 text-4xl animate-bounce drop-shadow-[0_0_16px_rgba(245,208,118,0.9)]">🍹✨</div>`;
      } else if (state === "sunrise_together" || state === "hold_hands_smile") {
        html = `<div class="fixed bottom-[150px] left-1/2 -translate-x-1/2 w-44 h-24 rounded-t-full bg-gradient-to-t from-amber-300/60 to-pink-400/30 blur-md"></div>`;
      } else if (state === "hug_giant_heart") {
        html = `<div class="fixed bottom-[225px] left-1/2 -translate-x-1/2 text-5xl animate-pulse drop-shadow-[0_0_24px_rgba(244,63,94,0.95)]">💖</div>`;
      }
      sceneProps.innerHTML = html;
    }

    function renderAt(t) {
      scrubTime.textContent = `${t.toFixed(1)}s`;
      clockBadge.textContent = `${t.toFixed(2)}s`;
      scrubFill.style.width = `${Math.min(100, (t / CONFIG.totalDuration) * 100)}%`;

      let bIdx = 0;
      for (let i = 0; i < LYRICS_TIMELINE.length; i++) {
        if (t >= getBlockStart(LYRICS_TIMELINE[i])) bIdx = i;
      }
      const b = LYRICS_TIMELINE[bIdx];

      if (bIdx !== currentIdx) {
        currentIdx = bIdx;
        document.body.className = `theme-${b.bgTheme}`;
        karaokeMain.innerHTML = b.lyric.split(" ").map((w) => `<span class="k-word">${w}</span>`).join(" ");
        karaokeSub.textContent = b.subText || "";
        renderSceneProps(b.state);
        if (b.crown) unlockCrown(b.crown - 1);
      }

      // Karaoke palabra por palabra
      const bs = getBlockStart(b);
      const be = getBlockEnd(b);
      const frac = Math.max(0, Math.min(1, (t - bs) / Math.max(0.1, be - bs)));
      const wEls = karaokeMain.querySelectorAll(".k-word");
      const activeW = Math.floor(frac * wEls.length);
      wEls.forEach((el, idx) => {
        el.classList.toggle("done", idx < activeW);
        el.classList.toggle("active", idx === activeW);
      });

      // Visibilidad corona inicial
      introCrownDrag.classList.toggle("visible", b.state === "crown_drop_equip" && !unlocked[0]);
      stageActors.classList.toggle("shake", b.state === "screen_shake_petals");
      btnFinalEnv.classList.toggle("hidden", b.state !== "grand_finale_envelope");

      // Expresiones y posturas de Camelita, Chico y Gatito
      const bounce = Math.abs(Math.sin(t * 7.5));
      camEyesStars.setAttribute("opacity", "0");
      camEyeClosedR.setAttribute("opacity", "0");
      camPropEmoji.setAttribute("opacity", "0");
      camBlush.setAttribute("opacity", "0.55");
      camSvg.style.transform = `translateY(${-bounce * 6}px)`;

      // Gatito aparece desde 9.5s
      charCat.style.opacity = t >= 9.5 ? "1" : "0";
      charCat.style.transform = `translateY(${-Math.abs(Math.sin(t * 8.5)) * 10}px)`;

      // Chico aparece desde 21.0s
      if (t >= 21.0) {
        charBoy.style.opacity = "1";
        charBoy.style.transform = b.state === "sunset_embrace" || b.state === "hold_hands_smile" ? "translateX(12px)" : "translateX(0px)";
      } else {
        charBoy.style.opacity = "0";
        charBoy.style.transform = "translateX(-80px)";
      }

      if (b.state === "intro_tiktok_dark" || b.state === "crown_drop_equip") {
        camLegL.style.transform = "rotate(34deg) translate(-6px,-6px)";
        camLegR.style.transform = "rotate(-34deg) translate(6px,-6px)";
        camSvg.style.transform = "translateY(14px)";
      } else {
        camLegL.style.transform = `rotate(${Math.sin(t * 10) * 16}deg)`;
        camLegR.style.transform = `rotate(${-Math.sin(t * 10) * 16}deg)`;
      }

      if (b.state === "reunion_blush_eyes" || b.state === "boy_appears_spark") {
        camEyesStars.setAttribute("opacity", "1");
        camBlush.setAttribute("opacity", "0.95");
      }
      if (b.state === "spin_happy_camelita" || b.state === "jump_sparkle_turn") {
        camSvg.style.transform = `translateY(${-bounce * 12}px) rotateY(${((t - bs) * 360) % 360}deg)`;
      }
      if (b.state === "love_gust_roses_crown3" || b.state === "screen_shake_petals" || b.state === "petal_and_diamond_rain") {
        if (Math.random() < 0.35) spawnFx(cw + 10, Math.random() * ch * 0.7, 1, "petal");
        if (b.state === "screen_shake_petals") camPropEmoji.setAttribute("opacity", "1");
      }
      if (b.state === "royal_crown4_unlock" || b.state === "royal_dance_1" || b.state === "grand_finale_envelope") {
        if (Math.random() < 0.32) spawnFx(Math.random() * cw, -10, 1, "gold");
        camArmL.style.transform = "rotate(110deg)";
        camArmR.style.transform = "rotate(-110deg)";
      } else {
        camArmL.style.transform = `rotate(${Math.sin(t * 8) * 18}deg)`;
        camArmR.style.transform = `rotate(${-Math.sin(t * 8) * 18}deg)`;
      }
    }

    function loop(now) {
      requestAnimationFrame(loop);
      drawCanvas(now);
      if (!running || paused) { lastNow = now; return; }
      const dt = (now - lastNow) / 1000;
      lastNow = now;
      if (!useAudio || audio.paused) virtualT += dt;
      const cur = useAudio && !audio.paused ? audio.currentTime : virtualT;
      renderAt(Math.min(CONFIG.totalDuration, cur));
    }
    requestAnimationFrame(loop);

    // Inicio y controles
    document.getElementById("btn-start").addEventListener("click", async () => {
      document.getElementById("start-overlay").classList.add("hidden-phase");
      running = true;
      lastNow = performance.now();
      if (CONFIG.musicUrl) {
        audio.src = CONFIG.musicUrl;
        try {
          await audio.play();
          useAudio = true;
          document.getElementById("play-label").textContent = "⏸";
          document.getElementById("btn-play").classList.add("playing");
        } catch { useAudio = false; }
      }
    });

    document.getElementById("btn-play").addEventListener("click", async () => {
      if (!running) return;
      paused = !paused;
      if (paused) {
        if (useAudio) audio.pause();
        document.getElementById("play-label").textContent = "▶";
        document.getElementById("btn-play").classList.remove("playing");
      } else {
        lastNow = performance.now();
        if (useAudio) await audio.play().catch(() => {});
        document.getElementById("play-label").textContent = "⏸";
        document.getElementById("btn-play").classList.add("playing");
      }
    });

    document.getElementById("scrub-track").addEventListener("click", (e) => {
      if (!running) return;
      const r = e.currentTarget.getBoundingClientRect();
      const targetT = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * CONFIG.totalDuration;
      virtualT = targetT;
      if (useAudio) audio.currentTime = targetT;
      renderAt(targetT);
    });

    btnFinalEnv.addEventListener("click", () => document.getElementById("final-modal").classList.add("open"));
    document.getElementById("btn-close-final").addEventListener("click", () => document.getElementById("final-modal").classList.remove("open"));

    // Modal Configuración & Calibración
    const cfgModal = document.getElementById("cfg-modal");
    document.getElementById("btn-cfg").addEventListener("click", () => {
      document.getElementById("inp-url").value = CONFIG.musicUrl;
      document.getElementById("offset-info").textContent = `Offset actual de voz: ${CONFIG.vocalStartOffset.toFixed(2)}s`;
      cfgModal.classList.add("open");
    });
    document.getElementById("btn-close-cfg").addEventListener("click", () => cfgModal.classList.remove("open"));
    document.getElementById("btn-set-vocal-offset").addEventListener("click", () => {
      const cur = useAudio && !audio.paused ? audio.currentTime : virtualT;
      CONFIG.vocalStartOffset = cur - 14.0;
      document.getElementById("offset-info").textContent = `Nuevo offset: ${CONFIG.vocalStartOffset.toFixed(2)}s ✅`;
    });
    document.getElementById("btn-apply-url").addEventListener("click", async () => {
      const url = document.getElementById("inp-url").value.trim();
      CONFIG.musicUrl = url;
      if (url) {
        audio.src = url;
        audio.currentTime = virtualT;
        await audio.play().then(() => { useAudio = true; }).catch(() => {});
      }
      cfgModal.classList.remove("open");
    });
  </script>
</body>
</html>
