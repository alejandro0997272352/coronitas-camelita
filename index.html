<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mundo 3D de Camelita 👑 — 14 de Noviembre</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #06060a;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
      touch-action: none;
    }
    .font-royal { font-family: 'Cinzel', serif; }

    #webgl-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
    }

    .glass-card {
      background: rgba(16, 16, 28, 0.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(245, 208, 118, 0.35);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
    }

    /* Intro Overlay */
    #intro-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background: radial-gradient(circle at center, rgba(16, 14, 30, 0.45) 0%, rgba(6, 6, 10, 0.85) 100%);
      transition: opacity 0.85s ease, visibility 0.85s ease;
    }
    #intro-overlay.hidden-phase {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .glow-btn {
      padding: 15px 30px;
      border-radius: 9999px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, rgba(245, 208, 118, 0.22), rgba(255, 126, 182, 0.26));
      border: 1.5px solid rgba(245, 208, 118, 0.8);
      box-shadow: 0 0 28px rgba(245, 208, 118, 0.35), inset 0 0 14px rgba(255, 126, 182, 0.25);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .glow-btn:hover { transform: scale(1.04); }
    .glow-btn:active { transform: scale(0.96); }

    /* Ondas de sonido */
    .waves { display: flex; align-items: flex-end; gap: 2.5px; height: 14px; }
    .waves span {
      width: 3px; height: 4px; border-radius: 3px;
      background: linear-gradient(to top, #ff7eb6, #f5d076);
    }
    .playing .waves span:nth-child(1) { animation: wv 0.6s infinite 0.0s; }
    .playing .waves span:nth-child(2) { animation: wv 0.6s infinite 0.18s; }
    .playing .waves span:nth-child(3) { animation: wv 0.6s infinite 0.34s; }
    .playing .waves span:nth-child(4) { animation: wv 0.6s infinite 0.1s; }
    @keyframes wv { 0%,100%{height:4px;} 50%{height:14px;} }

    /* Joystick Virtual */
    #joystick-zone {
      position: fixed;
      bottom: 20px;
      left: 20px;
      width: 118px;
      height: 118px;
      border-radius: 50%;
      background: rgba(18, 18, 32, 0.55);
      border: 2px solid rgba(245, 208, 118, 0.42);
      backdrop-filter: blur(10px);
      z-index: 35;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 24px rgba(0, 0, 0, 0.5);
    }
    #joystick-knob {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f5d076, #ff7eb6);
      box-shadow: 0 0 18px rgba(255, 126, 182, 0.75);
      pointer-events: none;
      transform: translate(0px, 0px);
    }

    /* Botones derecha */
    .action-controls {
      position: fixed;
      bottom: 20px;
      right: 18px;
      z-index: 35;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
    }

    .emote-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(18, 18, 32, 0.75);
      border: 1px solid rgba(255, 126, 182, 0.5);
      backdrop-filter: blur(10px);
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      transition: transform 0.12s ease;
    }
    .emote-btn:active { transform: scale(0.9); }

    .jump-btn {
      padding: 15px 24px;
      border-radius: 9999px;
      background: linear-gradient(135deg, rgba(245, 208, 118, 0.35), rgba(255, 126, 182, 0.42));
      border: 1.5px solid rgba(255, 126, 182, 0.85);
      backdrop-filter: blur(12px);
      font-weight: 800;
      font-size: 0.95rem;
      color: #fff;
      box-shadow: 0 0 24px rgba(255, 126, 182, 0.4);
      cursor: pointer;
      touch-action: none;
    }
    .jump-btn:active { transform: scale(0.93); }

    /* Modales */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 70;
      background: rgba(6, 6, 12, 0.78);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }
    .modal-backdrop.open { opacity: 1; visibility: visible; }
  </style>
</head>
<body>

  <canvas id="webgl-canvas"></canvas>

  <!-- HUD Superior Izquierdo -->
  <div id="hud" class="fixed top-3.5 left-3.5 z-40 glass-card rounded-2xl px-3.5 py-2 hidden">
    <div class="flex items-center gap-2 text-xs sm:text-sm font-bold text-amber-200">
      <span>Coronas:</span>
      <span id="hud-count" class="text-pink-300">0 / 4 👑</span>
    </div>
    <p id="hud-guide" class="text-[11px] text-slate-200/85 mt-0.5 max-w-[200px]">Explora las 4 islas iluminadas ✨</p>
  </div>

  <!-- Reproductor Superior Derecho -->
  <div class="fixed top-3.5 right-3.5 z-60 flex items-center gap-2">
    <button id="audio-btn" class="glass-card rounded-full px-3.5 py-2 flex items-center gap-2 text-xs font-semibold text-amber-100 cursor-pointer">
      <div class="waves"><span></span><span></span><span></span><span></span></div>
      <span id="audio-label">Música</span>
    </button>
    <button id="btn-music-cfg" class="glass-card rounded-full w-9 h-9 flex items-center justify-center text-sm cursor-pointer" title="Cambiar música">⚙️</button>
  </div>
  <audio id="bg-music" loop preload="auto"></audio>

  <!-- Banner de Dinámica / Minijuego Activo -->
  <div id="challenge-panel" class="fixed top-20 left-1/2 -translate-x-1/2 z-40 w-[92%] max-w-md glass-card rounded-2xl p-4 text-center hidden">
    <p id="challenge-title" class="font-royal text-sm sm:text-base font-bold text-amber-200 mb-2"></p>
    <div class="w-full h-3 bg-white/10 rounded-full overflow-hidden border border-white/15 mb-3">
      <div id="challenge-bar" class="h-full w-0 bg-gradient-to-r from-cyan-300 via-pink-400 to-amber-300 transition-all duration-150"></div>
    </div>
    <button id="challenge-action-btn" class="glow-btn text-xs sm:text-sm px-5 py-2.5 hidden"></button>
  </div>

  <!-- Hint de Drag 3D Inicial -->
  <div id="drag3d-hint" class="fixed top-20 left-1/2 -translate-x-1/2 z-40 glass-card rounded-full px-5 py-2.5 text-xs sm:text-sm text-amber-200 font-semibold text-center max-w-[90vw] hidden animate-bounce">
    Arrastra la corona 3D hacia la cabeza de Camelita 👑👇
  </div>

  <!-- FASE 1: Intro Cinemática -->
  <div id="intro-overlay">
    <div id="unlock-box" class="flex flex-col items-center gap-5 mt-28">
      <p class="font-royal text-xs tracking-[0.28em] uppercase text-amber-200/75">14 de Noviembre • Mundo 3D</p>
      <button id="open-btn" class="glow-btn text-base sm:text-lg">
        Entrar al Mundo de Camelita 👑
        <span class="block text-xs font-normal text-pink-200 mt-1">(Toca para iniciar)</span>
      </button>
    </div>

    <div id="intro-text-box" class="hidden max-w-xl px-4 opacity-0 translate-y-4 transition-all duration-700">
      <p id="intro-line-1" class="font-royal text-lg sm:text-2xl tracking-widest text-amber-200 drop-shadow-[0_0_16px_rgba(245,208,118,0.6)] mb-4"></p>
      <p id="intro-line-2" class="font-royal text-xl sm:text-3xl font-bold tracking-wider text-white drop-shadow-[0_0_24px_rgba(255,126,182,0.95)]"></p>
    </div>
  </div>

  <!-- Controles 3D (Joystick + Emotes + Saltar) -->
  <div id="controls-layer" class="hidden">
    <div id="joystick-zone">
      <div id="joystick-knob"></div>
    </div>

    <div class="action-controls">
      <div class="flex gap-2">
        <button id="btn-emote-hearts" class="emote-btn" title="Lanzar Corazones">💖</button>
        <button id="btn-emote-dance" class="emote-btn" title="Bailar / Girar">✨</button>
        <button id="btn-emote-glow" class="emote-btn" title="Brillar">👑</button>
      </div>
      <button id="btn-jump" class="jump-btn">⬆️ SALTAR</button>
    </div>
  </div>

  <!-- Modal Corona Desbloqueada -->
  <div id="crown-modal" class="modal-backdrop">
    <div class="glass-card rounded-3xl w-full max-w-md overflow-hidden">
      <div class="relative h-52 bg-black">
        <img id="cm-img" src="" alt="Corona" class="w-full h-full object-cover" />
        <div class="absolute inset-0 bg-gradient-to-t from-[#10101c] via-transparent to-transparent"></div>
        <span id="cm-badge" class="absolute top-3 left-3 text-xs font-royal uppercase tracking-widest px-3 py-1 rounded-full bg-black/65 border border-amber-200/40 text-amber-200"></span>
      </div>
      <div class="p-6 text-center">
        <h3 id="cm-title" class="font-royal text-xl font-bold text-amber-200 mb-3"></h3>
        <p id="cm-msg" class="text-sm sm:text-base text-slate-200 leading-relaxed mb-5"></p>
        <button id="cm-close" class="glow-btn text-sm px-6 py-2.5">Seguir explorando ✨</button>
      </div>
    </div>
  </div>

  <!-- Modal Carta Final -->
  <div id="final-modal" class="modal-backdrop">
    <div class="glass-card rounded-3xl w-full max-w-md p-6 sm:p-8 text-center max-h-[86vh] overflow-y-auto">
      <div class="text-4xl mb-3">💌👑🎆</div>
      <h2 class="font-royal text-2xl font-bold text-amber-200 mb-3">Para mi Reina, Camelita</h2>
      <p id="final-msg-text" class="text-sm sm:text-base text-slate-200 leading-relaxed whitespace-pre-line mb-6"></p>
      <button id="final-close" class="glow-btn text-sm px-6 py-2.5">Seguir paseando en el Mundo 3D ✨</button>
    </div>
  </div>

  <!-- Modal ⚙️ Música -->
  <div id="music-modal" class="modal-backdrop">
    <div class="glass-card rounded-3xl w-full max-w-sm p-6 text-center">
      <h3 class="font-royal text-lg font-bold text-amber-200 mb-2">⚙️ Música de Fondo</h3>
      <p class="text-xs text-slate-300 mb-3">Pega aquí el link directo de tu .mp3:</p>
      <input id="music-input" type="url" placeholder="https://.../musica.mp3" class="w-full px-3 py-2 rounded-xl bg-black/50 border border-amber-200/40 text-sm text-white mb-4 focus:outline-none focus:border-pink-400" />
      <div class="flex gap-2 justify-center">
        <button id="music-save" class="glow-btn text-xs px-5 py-2">Guardar ▶</button>
        <button id="music-cancel" class="glass-card rounded-full text-xs px-4 py-2 cursor-pointer">Cerrar</button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // 👇 PEGA AQUÍ EL LINK DE TU MÚSICA 👇
    // =========================================================================
    const CONFIG = {
      musicUrl: "./musica.mp3",
      introDate: "14 DE NOVIEMBRE? NO IMPORTA EL DÍA...",
      introSubtitle: "ESTAS CORONITAS SON PARA TI, CAMELITA 💗... <3",
      crowns: [
        {
          title: "Corona de Diamantes y Hielo",
          image: "https://images.unsplash.com/photo-1596944924616-7b38e7cfac36?auto=format&fit=crop&w=900&q=80",
          message: "Por esos ojitos tan lindos y por tener esa luz que brilla incluso en los días más grises ✨"
        },
        {
          title: "Corona Rebelde Morada",
          image: "https://images.unsplash.com/photo-1535632066927-ab7c9ab60908?auto=format&fit=crop&w=900&q=80",
          message: "Para la niña más inquieta, única y auténtica; porque tu vibra tan bonita no la tiene nadie más 💜"
        },
        {
          title: "Corona sobre Rosas Rojas",
          image: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=900&q=80",
          message: "Porque hay personas, risas y momentos que se quedan guardados con cariño sin importar el tiempo 🌹"
        },
        {
          title: "Corona Real Imperial",
          image: "https://images.unsplash.com/photo-1605100804763-247f67b3557e?auto=format&fit=crop&w=900&q=80",
          message: "Porque sea 14 de noviembre o cualquier otro día, Camelita siempre merece todo lo bonito de este mundo 👑"
        }
      ],
      finalMessage:
        "No importa si es 14 de noviembre o cualquier otro día: siempre habrá mil razones para recordarte lo increíble que eres.\n\n" +
        "Liberaste cada corona, superaste cada reto y ahora todas brillan alrededor de ti, aunque siempre fueron tuyas.\n\n" +
        "Nunca dejes de sonreír, Camelita. Mereces todo lo más bonito de este mundo. 💗👑✨"
    };

    // =========================================================================
    // AUDIO Y REPRODUCTOR
    // =========================================================================
    const bgMusic = document.getElementById("bg-music");
    const audioBtn = document.getElementById("audio-btn");
    const audioLabel = document.getElementById("audio-label");
    const musicModal = document.getElementById("music-modal");
    const musicInput = document.getElementById("music-input");

    if (CONFIG.musicUrl) bgMusic.src = CONFIG.musicUrl;
    musicInput.value = CONFIG.musicUrl;

    function syncAudioUI() {
      if (!bgMusic.paused) {
        audioBtn.classList.add("playing");
        audioLabel.textContent = "Sonando";
      } else {
        audioBtn.classList.remove("playing");
        audioLabel.textContent = "Música";
      }
    }
    async function tryPlayAudio() {
      if (!bgMusic.src) return;
      try { await bgMusic.play(); } catch {}
      syncAudioUI();
    }
    audioBtn.addEventListener("click", async () => {
      if (bgMusic.paused) await tryPlayAudio();
      else { bgMusic.pause(); syncAudioUI(); }
    });
    document.getElementById("btn-music-cfg").addEventListener("click", () => musicModal.classList.add("open"));
    document.getElementById("music-cancel").addEventListener("click", () => musicModal.classList.remove("open"));
    document.getElementById("music-save").addEventListener("click", async () => {
      const url = musicInput.value.trim();
      CONFIG.musicUrl = url;
      if (url) { bgMusic.src = url; await tryPlayAudio(); }
      else { bgMusic.pause(); syncAudioUI(); }
      musicModal.classList.remove("open");
    });

    // =========================================================================
    // ESCENA THREE.JS
    // =========================================================================
    const canvas = document.getElementById("webgl-canvas");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x06060c);
    scene.fog = new THREE.FogExp2(0x06060c, 0.022);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
    // Posición inicial en Fase 1 (enfocando corona introductoria en el espacio)
    camera.position.set(0, 14, 24);
    camera.lookAt(0, 13, 0);

    // Luces
    scene.add(new THREE.AmbientLight(0xd8b4fe, 0.65));
    const dirLight = new THREE.DirectionalLight(0xffe4b5, 1.15);
    dirLight.position.set(8, 18, 10);
    dirLight.castShadow = true;
    scene.add(dirLight);
    const pinkLight = new THREE.PointLight(0xff7eb6, 1.4, 30);
    pinkLight.position.set(-5, 6, 5);
    scene.add(pinkLight);

    // Estrellas 3D
    const starGeo = new THREE.BufferGeometry();
    const starCount = 900;
    const starPos = new Float32Array(starCount * 3);
    const starCol = new Float32Array(starCount * 3);
    const cPalette = [new THREE.Color(0xf5d076), new THREE.Color(0xff7eb6), new THREE.Color(0xc084fc), new THREE.Color(0xffffff)];
    for (let i = 0; i < starCount; i++) {
      starPos[i * 3] = (Math.random() - 0.5) * 110;
      starPos[i * 3 + 1] = Math.random() * 55 - 5;
      starPos[i * 3 + 2] = (Math.random() - 0.5) * 110;
      const col = cPalette[i % cPalette.length];
      starCol[i * 3] = col.r; starCol[i * 3 + 1] = col.g; starCol[i * 3 + 2] = col.b;
    }
    starGeo.setAttribute("position", new THREE.BufferAttribute(starPos, 3));
    starGeo.setAttribute("color", new THREE.BufferAttribute(starCol, 3));
    const starsMesh = new THREE.Points(starGeo, new THREE.PointsMaterial({ size: 0.28, vertexColors: true, transparent: true, opacity: 0.9 }));
    scene.add(starsMesh);

    // Helper para crear una Corona 3D estilizada
    function createCrown3D(color = 0xf5d076, gemColor = 0xff7eb6, scale = 1) {
      const g = new THREE.Group();
      const goldMat = new THREE.MeshStandardMaterial({ color, metalness: 0.75, roughness: 0.22, emissive: color, emissiveIntensity: 0.2 });
      const gemMat = new THREE.MeshStandardMaterial({ color: gemColor, metalness: 0.2, roughness: 0.1, emissive: gemColor, emissiveIntensity: 0.55 });
      const base = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.08, 12, 28), goldMat);
      base.rotation.x = Math.PI / 2;
      g.add(base);
      for (let i = 0; i < 5; i++) {
        const a = (i / 5) * Math.PI * 2;
        const spike = new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.42, 8), goldMat);
        spike.position.set(Math.cos(a) * 0.4, 0.22, Math.sin(a) * 0.4);
        g.add(spike);
        const gem = new THREE.Mesh(new THREE.OctahedronGeometry(0.075), gemMat);
        gem.position.set(Math.cos(a) * 0.4, 0.46, Math.sin(a) * 0.4);
        g.add(gem);
      }
      g.scale.setScalar(scale);
      return g;
    }

    // Corona gigante de la Intro
    const introCrown = createCrown3D(0xf5d076, 0xff7eb6, 2.1);
    introCrown.position.set(0, 13.6, 17);
    scene.add(introCrown);

    // Plataforma Central de Cristal
    const centerPlatform = new THREE.Mesh(
      new THREE.CylinderGeometry(5.2, 5.8, 0.6, 36),
      new THREE.MeshStandardMaterial({ color: 0x1a1630, metalness: 0.4, roughness: 0.25, emissive: 0x4c1d95, emissiveIntensity: 0.28 })
    );
    centerPlatform.position.set(0, -0.3, 0);
    centerPlatform.receiveShadow = true;
    scene.add(centerPlatform);

    const centerRing = new THREE.Mesh(
      new THREE.TorusGeometry(5.25, 0.08, 12, 64),
      new THREE.MeshBasicMaterial({ color: 0xf5d076 })
    );
    centerRing.rotation.x = Math.PI / 2;
    centerRing.position.y = 0.02;
    scene.add(centerRing);

    // =========================================================================
    // PERSONAJE 3D "CAMELITA" + SPRITE "✨ Camelita ✨"
    // =========================================================================
    const camelitaGroup = new THREE.Group();
    scene.add(camelitaGroup);

    const skinMat = new THREE.MeshToonMaterial({ color: 0xc68b67 });
    const hoodieMat = new THREE.MeshStandardMaterial({ color: 0x171722, roughness: 0.7 });
    const hairMat = new THREE.MeshStandardMaterial({ color: 0x141018, roughness: 0.6 });
    const blushMat = new THREE.MeshBasicMaterial({ color: 0xf472b6, transparent: true, opacity: 0.65 });

    // Cuerpo (Hoodie)
    const bodyMesh = new THREE.Mesh(new THREE.CapsuleGeometry(0.42, 0.55, 8, 16), hoodieMat);
    bodyMesh.position.y = 0.95;
    camelitaGroup.add(bodyMesh);

    // Cabeza
    const headGroup = new THREE.Group();
    headGroup.position.y = 1.75;
    camelitaGroup.add(headGroup);

    const headMesh = new THREE.Mesh(new THREE.SphereGeometry(0.52, 24, 24), skinMat);
    headGroup.add(headMesh);

    // Cabello largo oscuro
    const hairBack = new THREE.Mesh(new THREE.SphereGeometry(0.56, 20, 20, 0, Math.PI * 2, 0, Math.PI * 0.68), hairMat);
    hairBack.rotation.x = -0.35;
    headGroup.add(hairBack);
    const hairTail = new THREE.Mesh(new THREE.CapsuleGeometry(0.38, 0.65, 8, 12), hairMat);
    hairTail.position.set(0, -0.45, -0.25);
    headGroup.add(hairTail);

    // Ojos grandes oscuros + reflejos blancos
    [-0.19, 0.19].forEach((ex) => {
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.11, 14, 14), new THREE.MeshBasicMaterial({ color: 0x0f0b14 }));
      eye.position.set(ex, 0.02, 0.44);
      eye.scale.set(0.9, 1.15, 0.6);
      headGroup.add(eye);
      const glint = new THREE.Mesh(new THREE.SphereGeometry(0.038, 10, 10), new THREE.MeshBasicMaterial({ color: 0xffffff }));
      glint.position.set(ex + 0.03, 0.06, 0.51);
      headGroup.add(glint);
    });

    // Mejillas sonrojadas
    [-0.31, 0.31].forEach((bx) => {
      const blush = new THREE.Mesh(new THREE.SphereGeometry(0.085, 10, 10), blushMat);
      blush.position.set(bx, -0.1, 0.41);
      blush.scale.set(1.2, 0.7, 0.4);
      headGroup.add(blush);
    });

    // Brazos y piernas
    const leftArm = new THREE.Mesh(new THREE.CapsuleGeometry(0.12, 0.38, 6, 10), hoodieMat);
    leftArm.position.set(-0.52, 1.0, 0);
    leftArm.rotation.z = 0.35;
    camelitaGroup.add(leftArm);

    const rightArm = new THREE.Mesh(new THREE.CapsuleGeometry(0.12, 0.38, 6, 10), hoodieMat);
    rightArm.position.set(0.52, 1.0, 0);
    rightArm.rotation.z = -0.35;
    camelitaGroup.add(rightArm);

    const leftLeg = new THREE.Mesh(new THREE.CapsuleGeometry(0.13, 0.36, 6, 10), skinMat);
    leftLeg.position.set(-0.2, 0.34, 0);
    camelitaGroup.add(leftLeg);

    const rightLeg = new THREE.Mesh(new THREE.CapsuleGeometry(0.13, 0.36, 6, 10), skinMat);
    rightLeg.position.set(0.2, 0.34, 0);
    camelitaGroup.add(rightLeg);

    // Corona equipada en la cabeza (oculta al inicio)
    const wornCrown3D = createCrown3D(0xf5d076, 0xff7eb6, 0.85);
    wornCrown3D.position.set(0, 0.62, 0);
    wornCrown3D.visible = false;
    headGroup.add(wornCrown3D);

    // Sprite 3D "✨ Camelita ✨" siempre encima de su cabeza
    function makeNameSprite(text) {
      const c = document.createElement("canvas");
      c.width = 512; c.height = 128;
      const cx = c.getContext("2d");
      cx.font = "bold 48px 'Plus Jakarta Sans', sans-serif";
      cx.textAlign = "center";
      cx.textBaseline = "middle";
      cx.shadowColor = "#ff7eb6";
      cx.shadowBlur = 20;
      cx.fillStyle = "rgba(255,255,255,0.98)";
      cx.fillText(text, 256, 64);
      const tex = new THREE.CanvasTexture(c);
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
      const sp = new THREE.Sprite(mat);
      sp.scale.set(2.8, 0.7, 1);
      return sp;
    }
    const nameSprite = makeNameSprite("✨ Camelita ✨");
    nameSprite.position.set(0, 2.95, 0);
    camelitaGroup.add(nameSprite);

    // =========================================================================
    // CORONA INICIAL ARRASTRABLE EN 3D (DINÁMICA 0)
    // =========================================================================
    const initialCrown3D = createCrown3D(0xf5d076, 0xff7eb6, 1.15);
    initialCrown3D.position.set(0, 1.7, 2.6);
    initialCrown3D.visible = false;
    scene.add(initialCrown3D);

    // =========================================================================
    // 4 ISLAS + CAMINOS BRILLANTES + COFRE FINAL
    // =========================================================================
    const islandsGroup = new THREE.Group();
    islandsGroup.visible = false;
    scene.add(islandsGroup);

    const islandDefs = [
      { pos: new THREE.Vector3(-12, 0, -4), color: 0x38bdf8 }, // 1: Cristal
      { pos: new THREE.Vector3(12, 0, -4), color: 0xa855f7 },  // 2: Rebelde Morada
      { pos: new THREE.Vector3(-10, 0, 11), color: 0xf43f5e }, // 3: Rosas Rojas
      { pos: new THREE.Vector3(11, 0, 11), color: 0xf59e0b }   // 4: Escalera al Cielo
    ];

    function buildBridge(from, to, color) {
      const dist = from.distanceTo(to);
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(1.4, 0.16, dist),
        new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.45 })
      );
      mesh.position.copy(from).add(to).multiplyScalar(0.5);
      mesh.position.y = -0.05;
      mesh.lookAt(to.x, -0.05, to.z);
      islandsGroup.add(mesh);
    }

    islandDefs.forEach((isl) => {
      buildBridge(new THREE.Vector3(0, 0, 0), isl.pos, isl.color);
      const pad = new THREE.Mesh(
        new THREE.CylinderGeometry(3.2, 3.6, 0.5, 28),
        new THREE.MeshStandardMaterial({ color: 0x161426, emissive: isl.color, emissiveIntensity: 0.25 })
      );
      pad.position.set(isl.pos.x, -0.25, isl.pos.z);
      islandsGroup.add(pad);
    });

    // Dinámica 1: Esfera de hielo + Corona 1
    const crown1 = createCrown3D(0xe0f2fe, 0x38bdf8, 1.0);
    crown1.position.set(islandDefs[0].pos.x, 1.3, islandDefs[0].pos.z);
    islandsGroup.add(crown1);
    const iceSphere = new THREE.Mesh(
      new THREE.IcosahedronGeometry(1.15, 1),
      new THREE.MeshStandardMaterial({ color: 0x7dd3fc, transparent: true, opacity: 0.52, roughness: 0.1, metalness: 0.3 })
    );
    iceSphere.position.copy(crown1.position);
    islandsGroup.add(iceSphere);

    // Dinámica 2: Corona 2 inquieta
    const crown2 = createCrown3D(0xc084fc, 0x1e1b4b, 1.05);
    crown2.position.set(islandDefs[1].pos.x, 1.6, islandDefs[1].pos.z);
    islandsGroup.add(crown2);

    // Dinámica 3: Pedestal + Corona 3 sobre Rosas Rojas
    const rosePedestal = new THREE.Group();
    rosePedestal.position.set(islandDefs[2].pos.x, -2.5, islandDefs[2].pos.z);
    const pedMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 1.1, 1.4, 20), new THREE.MeshStandardMaterial({ color: 0x881337 }));
    pedMesh.position.y = 0.7;
    rosePedestal.add(pedMesh);
    const crown3 = createCrown3D(0xf5d076, 0xe11d48, 1.0);
    crown3.position.y = 1.9;
    rosePedestal.add(crown3);
    islandsGroup.add(rosePedestal);

    // Dinámica 4: 3 Escalones mágicos + Corona 4 en la cima
    const stairs = [
      { x: 7.5, y: 0.7, z: 7.5, w: 2.6, d: 2.6 },
      { x: 9.2, y: 1.5, z: 9.2, w: 2.6, d: 2.6 },
      { x: 11.0, y: 2.3, z: 11.0, w: 3.4, d: 3.4 }
    ];
    const stairMeshes = stairs.map((st) => {
      const m = new THREE.Mesh(
        new THREE.BoxGeometry(st.w, 0.35, st.d),
        new THREE.MeshStandardMaterial({ color: 0x2e1065, emissive: 0xf59e0b, emissiveIntensity: 0.25 })
      );
      m.position.set(st.x, st.y - 0.175, st.z);
      islandsGroup.add(m);
      return m;
    });
    const crown4 = createCrown3D(0xfbbf24, 0xff7eb6, 1.15);
    crown4.position.set(11.0, 3.3, 11.0);
    islandsGroup.add(crown4);

    // Cofre Real Final en el centro
    const finalChest = new THREE.Group();
    finalChest.position.set(0, 0.5, -2.2);
    finalChest.visible = false;
    const chestBox = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.9, 1.0), new THREE.MeshStandardMaterial({ color: 0xd97706, metalness: 0.6, roughness: 0.3 }));
    finalChest.add(chestBox);
    const chestGem = new THREE.Mesh(new THREE.OctahedronGeometry(0.32), new THREE.MeshBasicMaterial({ color: 0xff7eb6 }));
    chestGem.position.set(0, 0.75, 0);
    finalChest.add(chestGem);
    scene.add(finalChest);

    // Orbitantes al conseguir las 4 coronas
    const orbitingCrowns = new THREE.Group();
    orbitingCrowns.visible = false;
    [0x38bdf8, 0xa855f7, 0xf43f5e, 0xfbbf24].forEach((c, idx) => {
      const oc = createCrown3D(0xf5d076, c, 0.52);
      const ang = (idx / 4) * Math.PI * 2;
      oc.position.set(Math.cos(ang) * 1.4, 1.5, Math.sin(ang) * 1.4);
      orbitingCrowns.add(oc);
    });
    camelitaGroup.add(orbitingCrowns);

    // Partículas 3D temporales (explosiones, corazones, pétalos, fuegos)
    const fxParticles = [];
    function spawnFX3D(origin, color, count = 26, mode = "burst") {
      const geo = new THREE.OctahedronGeometry(0.12);
      const mat = new THREE.MeshBasicMaterial({ color });
      for (let i = 0; i < count; i++) {
        const m = new THREE.Mesh(geo, mat);
        if (mode === "rain") {
          m.position.set(origin.x + (Math.random() - 0.5) * 6, 7 + Math.random() * 3, origin.z + (Math.random() - 0.5) * 6);
          m.userData = { vx: (Math.random() - 0.5) * 0.03, vy: -0.07 - Math.random() * 0.05, vz: (Math.random() - 0.5) * 0.03, life: 95 };
        } else {
          m.position.copy(origin);
          const a = Math.random() * Math.PI * 2;
          const sp = 0.06 + Math.random() * 0.14;
          m.userData = { vx: Math.cos(a) * sp, vy: 0.08 + Math.random() * 0.14, vz: Math.sin(a) * sp, life: 55 };
        }
        scene.add(m);
        fxParticles.push(m);
      }
    }

    // =========================================================================
    // ESTADO DEL JUEGO Y CONTROLES
    // =========================================================================
    let phase = "intro"; // 'intro' | 'drag0' | 'explore'
    let dragActive = false;
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -2.0);

    const playerState = { vy: 0, grounded: true, floorY: 0, dancing: false };
    const joyVec = { x: 0, y: 0 };
    const keys = { w: false, a: false, s: false, d: false };
    const collected = [false, false, false, false];
    let activeChallenge = 0; // 0=none, 1=ice, 2=rebel, 3=roses
    let iceProgress = 0;
    let rebelHits = 0;
    let roseProgress = 0;
    let finalOpened = false;

    const hud = document.getElementById("hud");
    const hudCount = document.getElementById("hud-count");
    const hudGuide = document.getElementById("hud-guide");
    const drag3dHint = document.getElementById("drag3d-hint");
    const controlsLayer = document.getElementById("controls-layer");
    const challengePanel = document.getElementById("challenge-panel");
    const challengeTitle = document.getElementById("challenge-title");
    const challengeBar = document.getElementById("challenge-bar");
    const challengeBtn = document.getElementById("challenge-action-btn");

    // FASE 1: Intro
    document.getElementById("intro-line-1").textContent = CONFIG.introDate;
    document.getElementById("intro-line-2").textContent = CONFIG.introSubtitle;

    document.getElementById("open-btn").addEventListener("click", () => {
      tryPlayAudio();
      document.getElementById("unlock-box").classList.add("hidden");
      const tb = document.getElementById("intro-text-box");
      tb.classList.remove("hidden");
      requestAnimationFrame(() => tb.classList.remove("opacity-0", "translate-y-4"));

      setTimeout(() => {
        gsap.to(introCrown.scale, { x: 0.01, y: 0.01, z: 0.01, duration: 0.8 });
        gsap.to(camera.position, {
          x: 0, y: 3.6, z: 7.2, duration: 1.8, ease: "power3.inOut",
          onUpdate: () => camera.lookAt(0, 1.4, 0),
          onComplete: () => {
            document.getElementById("intro-overlay").classList.add("hidden-phase");
            phase = "drag0";
            initialCrown3D.visible = true;
            drag3dHint.classList.remove("hidden");
          }
        });
      }, 4500);
    });

    // Raycaster para Drag 3D (Dinámica 0) + Frotar Hielo (Dinámica 1) + Atrapar Corona 2 (Dinámica 2)
    function updatePointer(e) {
      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
    }

    canvas.addEventListener("pointerdown", (e) => {
      updatePointer(e);
      raycaster.setFromCamera(pointer, camera);

      if (phase === "drag0") {
        const hits = raycaster.intersectObject(initialCrown3D, true);
        if (hits.length > 0) dragActive = true;
      } else if (phase === "explore" && activeChallenge === 2 && !collected[1]) {
        const hits = raycaster.intersectObject(crown2, true);
        if (hits.length > 0) hitRebelCrown();
      }
    });

    window.addEventListener("pointermove", (e) => {
      updatePointer(e);
      if (phase === "drag0" && dragActive) {
        raycaster.setFromCamera(pointer, camera);
        const pt = new THREE.Vector3();
        raycaster.ray.intersectPlane(dragPlane, pt);
        if (pt) {
          initialCrown3D.position.x = THREE.MathUtils.clamp(pt.x, -4, 4);
          initialCrown3D.position.y = THREE.MathUtils.clamp(pt.y, 0.8, 4.5);
        }
      } else if (phase === "explore" && activeChallenge === 1 && !collected[0]) {
        iceProgress = Math.min(100, iceProgress + 3.2);
        challengeBar.style.width = `${iceProgress}%`;
        iceSphere.rotation.y += 0.15;
        if (iceProgress >= 100) completeCrown(0);
      }
    });

    window.addEventListener("pointerup", () => {
      if (phase === "drag0" && dragActive) {
        dragActive = false;
        const headWorld = new THREE.Vector3(0, 2.2, 0);
        if (initialCrown3D.position.distanceTo(headWorld) < 1.65) {
          // ¡Coronada!
          initialCrown3D.visible = false;
          wornCrown3D.visible = true;
          drag3dHint.classList.add("hidden");
          spawnFX3D(new THREE.Vector3(0, 2.3, 0), 0xf5d076, 36);
          spawnFX3D(new THREE.Vector3(0, 2.3, 0), 0xff7eb6, 28);
          islandsGroup.visible = true;
          phase = "explore";
          hud.classList.remove("hidden");
          controlsLayer.classList.remove("hidden");
          playerState.vy = 0.22;
          playerState.grounded = false;
        }
      }
    });

    function hitRebelCrown() {
      rebelHits++;
      challengeBar.style.width = `${(rebelHits / 3) * 100}%`;
      spawnFX3D(crown2.position, 0xa855f7, 20);
      if (rebelHits >= 3) completeCrown(1);
    }

    challengeBtn.addEventListener("click", () => {
      if (activeChallenge === 2 && !collected[1]) {
        hitRebelCrown();
      } else if (activeChallenge === 3 && !collected[2]) {
        roseProgress = Math.min(100, roseProgress + 16);
        challengeBar.style.width = `${roseProgress}%`;
        spawnFX3D(islandDefs[2].pos, 0xe11d48, 12, "rain");
        if (roseProgress >= 100) {
          gsap.to(rosePedestal.position, { y: 0, duration: 0.9, ease: "back.out(1.4)" });
          completeCrown(2);
        }
      }
    });

    function completeCrown(idx) {
      if (collected[idx]) return;
      collected[idx] = true;
      activeChallenge = 0;
      challengePanel.classList.add("hidden");
      challengeBtn.classList.add("hidden");

      if (idx === 0) { iceSphere.visible = false; crown1.visible = false; }
      if (idx === 1) crown2.visible = false;
      if (idx === 2) crown3.visible = false;
      if (idx === 3) { crown4.visible = false; orbitingCrowns.visible = true; }

      const count = collected.filter(Boolean).length;
      hudCount.textContent = `${count} / 4 👑`;
      spawnFX3D(camelitaGroup.position.clone().add(new THREE.Vector3(0, 2, 0)), 0xf5d076, 35);

      // Abrir modal
      const data = CONFIG.crowns[idx];
      document.getElementById("cm-img").src = data.image;
      document.getElementById("cm-badge").textContent = `Corona ${idx + 1} de 4`;
      document.getElementById("cm-title").textContent = data.title;
      document.getElementById("cm-msg").textContent = data.message;
      document.getElementById("crown-modal").classList.add("open");

      if (count === 4) {
        finalChest.visible = true;
        hudGuide.textContent = "¡Ve al centro por el Cofre Real! 💌";
      }
    }
    document.getElementById("cm-close").addEventListener("click", () => {
      document.getElementById("crown-modal").classList.remove("open");
    });
    document.getElementById("final-close").addEventListener("click", () => {
      document.getElementById("final-modal").classList.remove("open");
    });

    // Joystick Virtual
    const joyZone = document.getElementById("joystick-zone");
    const joyKnob = document.getElementById("joystick-knob");
    let joyDragging = false;
    function updateJoy(cx, cy) {
      const r = joyZone.getBoundingClientRect();
      const dx = cx - (r.left + r.width / 2);
      const dy = cy - (r.top + r.height / 2);
      const maxR = 38;
      const dist = Math.min(maxR, Math.hypot(dx, dy));
      const ang = Math.atan2(dy, dx);
      const kx = Math.cos(ang) * dist;
      const ky = Math.sin(ang) * dist;
      joyKnob.style.transform = `translate(${kx}px, ${ky}px)`;
      joyVec.x = kx / maxR;
      joyVec.y = ky / maxR;
    }
    joyZone.addEventListener("pointerdown", (e) => { e.preventDefault(); joyDragging = true; updateJoy(e.clientX, e.clientY); });
    window.addEventListener("pointermove", (e) => { if (joyDragging) updateJoy(e.clientX, e.clientY); });
    window.addEventListener("pointerup", () => {
      joyDragging = false;
      joyKnob.style.transform = "translate(0px, 0px)";
      joyVec.x = 0; joyVec.y = 0;
    });

    // Teclado PC + Botón Saltar + Emotes
    window.addEventListener("keydown", (e) => {
      if (e.code === "KeyW" || e.code === "ArrowUp") keys.w = true;
      if (e.code === "KeyS" || e.code === "ArrowDown") keys.s = true;
      if (e.code === "KeyA" || e.code === "ArrowLeft") keys.a = true;
      if (e.code === "KeyD" || e.code === "ArrowRight") keys.d = true;
      if (e.code === "Space") doJump();
    });
    window.addEventListener("keyup", (e) => {
      if (e.code === "KeyW" || e.code === "ArrowUp") keys.w = false;
      if (e.code === "KeyS" || e.code === "ArrowDown") keys.s = false;
      if (e.code === "KeyA" || e.code === "ArrowLeft") keys.a = false;
      if (e.code === "KeyD" || e.code === "ArrowRight") keys.d = false;
    });

    function doJump() {
      if (phase === "explore" && playerState.grounded) {
        playerState.vy = 0.25;
        playerState.grounded = false;
      }
    }
    document.getElementById("btn-jump").addEventListener("pointerdown", (e) => { e.preventDefault(); doJump(); });

    // Emotes
    document.getElementById("btn-emote-hearts").addEventListener("click", () => {
      gsap.to(camelitaGroup.rotation, { y: camelitaGroup.rotation.y + Math.PI * 2, duration: 0.7 });
      spawnFX3D(camelitaGroup.position.clone().add(new THREE.Vector3(0, 1.8, 0)), 0xff7eb6, 28);
    });
    document.getElementById("btn-emote-dance").addEventListener("click", () => {
      playerState.dancing = true;
      setTimeout(() => { playerState.dancing = false; }, 1600);
    });
    document.getElementById("btn-emote-glow").addEventListener("click", () => {
      spawnFX3D(camelitaGroup.position.clone().add(new THREE.Vector3(0, 2.2, 0)), 0xf5d076, 30);
    });

    // =========================================================================
    // LOOP PRINCIPAL 60 FPS
    // =========================================================================
    let clockT = 0;
    function animate() {
      requestAnimationFrame(animate);
      clockT += 0.016;

      starsMesh.rotation.y += 0.0004;
      introCrown.rotation.y += 0.015;
      initialCrown3D.rotation.y += 0.025;
      if (phase === "drag0" && !dragActive) {
        initialCrown3D.position.y = 1.7 + Math.sin(clockT * 3) * 0.14;
      }

      crown1.rotation.y += 0.02;
      crown2.rotation.y += 0.04;
      crown3.rotation.y += 0.02;
      crown4.rotation.y += 0.03;
      orbitingCrowns.rotation.y += 0.025;

      // Corona 2 inquieta volando en círculos
      if (!collected[1]) {
        crown2.position.x = islandDefs[1].pos.x + Math.cos(clockT * 2.2) * 1.9;
        crown2.position.z = islandDefs[1].pos.z + Math.sin(clockT * 2.2) * 1.9;
        crown2.position.y = 1.6 + Math.sin(clockT * 4) * 0.25;
      }

      if (phase === "explore") {
        let mx = joyVec.x + (keys.d ? 1 : 0) - (keys.a ? 1 : 0);
        let mz = joyVec.y + (keys.s ? 1 : 0) - (keys.w ? 1 : 0);
        const len = Math.hypot(mx, mz);
        if (len > 0.1) {
          mx /= Math.max(1, len);
          mz /= Math.max(1, len);
          camelitaGroup.position.x += mx * 0.12;
          camelitaGroup.position.z += mz * 0.12;
          camelitaGroup.rotation.y = Math.atan2(mx, mz);
          // Caminata
          leftLeg.rotation.x = Math.sin(clockT * 14) * 0.55;
          rightLeg.rotation.x = -Math.sin(clockT * 14) * 0.55;
          leftArm.rotation.x = -Math.sin(clockT * 14) * 0.45;
          rightArm.rotation.x = Math.sin(clockT * 14) * 0.45;
        } else if (playerState.dancing) {
          leftArm.rotation.z = 1.8 + Math.sin(clockT * 15) * 0.6;
          rightArm.rotation.z = -1.8 - Math.sin(clockT * 15) * 0.6;
          camelitaGroup.rotation.y += 0.12;
        } else {
          leftLeg.rotation.x *= 0.85; rightLeg.rotation.x *= 0.85;
          leftArm.rotation.x *= 0.85; rightArm.rotation.x *= 0.85;
          leftArm.rotation.z = 0.35; rightArm.rotation.z = -0.35;
        }

        // Límites del mapa
        camelitaGroup.position.x = THREE.MathUtils.clamp(camelitaGroup.position.x, -16, 16);
        camelitaGroup.position.z = THREE.MathUtils.clamp(camelitaGroup.position.z, -10, 16);

        // Soporte de plataformas elevadas (Dinámica 4)
        let targetFloor = 0;
        stairs.forEach((st, i) => {
          if (Math.abs(camelitaGroup.position.x - st.x) < st.w * 0.55 &&
              Math.abs(camelitaGroup.position.z - st.z) < st.d * 0.55 &&
              camelitaGroup.position.y >= st.y - 0.5) {
            targetFloor = Math.max(targetFloor, st.y);
            stairMeshes[i].material.emissiveIntensity = 0.8;
          }
        });

        // Gravedad y salto
        playerState.vy -= 0.012;
        camelitaGroup.position.y += playerState.vy;
        if (camelitaGroup.position.y <= targetFloor) {
          camelitaGroup.position.y = targetFloor;
          playerState.vy = 0;
          playerState.grounded = true;
        }

        // Cámara suave siguiendo a Camelita
        camera.position.x += (camelitaGroup.position.x - camera.position.x) * 0.08;
        camera.position.z += (camelitaGroup.position.z + 7.2 - camera.position.z) * 0.08;
        camera.position.y += (camelitaGroup.position.y + 3.8 - camera.position.y) * 0.08;
        camera.lookAt(camelitaGroup.position.x, camelitaGroup.position.y + 1.4, camelitaGroup.position.z);

        // Detección de zonas / dinámicas
        const d1 = Math.hypot(camelitaGroup.position.x - islandDefs[0].pos.x, camelitaGroup.position.z - islandDefs[0].pos.z);
        const d2 = Math.hypot(camelitaGroup.position.x - islandDefs[1].pos.x, camelitaGroup.position.z - islandDefs[1].pos.z);
        const d3 = Math.hypot(camelitaGroup.position.x - islandDefs[2].pos.x, camelitaGroup.position.z - islandDefs[2].pos.z);
        const d4 = Math.hypot(camelitaGroup.position.x - 11.0, camelitaGroup.position.z - 11.0);

        if (d1 < 3.4 && !collected[0]) {
          if (activeChallenge !== 1) {
            activeChallenge = 1;
            challengePanel.classList.remove("hidden");
            challengeBtn.classList.add("hidden");
            challengeTitle.textContent = "¡Frota la pantalla para liberar la 1ra Corona! ❄️✨";
            challengeBar.style.width = `${iceProgress}%`;
          }
        } else if (d2 < 3.8 && !collected[1]) {
          if (activeChallenge !== 2) {
            activeChallenge = 2;
            challengePanel.classList.remove("hidden");
            challengeBtn.classList.remove("hidden");
            challengeBtn.textContent = "✨ ¡Atrapar Corona Rebelde!";
            challengeTitle.textContent = "¡Toca la corona 3 veces (o usa el botón)! 💜";
            challengeBar.style.width = `${(rebelHits / 3) * 100}%`;
          }
        } else if (d3 < 3.4 && !collected[2]) {
          if (activeChallenge !== 3) {
            activeChallenge = 3;
            challengePanel.classList.remove("hidden");
            challengeBtn.classList.remove("hidden");
            challengeBtn.textContent = "🌹❤️ ¡Toca rápido para hacer florecer las rosas!";
            challengeTitle.textContent = "¡Lluvia de pétalos para la 3ra Corona! 🌹";
            challengeBar.style.width = `${roseProgress}%`;
          }
        } else if (activeChallenge !== 0) {
          activeChallenge = 0;
          challengePanel.classList.add("hidden");
        }

        // Corona 4 al llegar a la cima
        if (d4 < 2.2 && camelitaGroup.position.y >= 2.0 && !collected[3]) {
          completeCrown(3);
        }

        // Cofre Real Final (4/4)
        if (finalChest.visible && !finalOpened) {
          finalChest.rotation.y += 0.02;
          if (Math.random() < 0.06) {
            spawnFX3D(new THREE.Vector3((Math.random() - 0.5) * 6, 4 + Math.random() * 3, -2), Math.random() < 0.5 ? 0xf5d076 : 0xff7eb6, 14);
          }
          if (camelitaGroup.position.distanceTo(finalChest.position) < 2.2) {
            finalOpened = true;
            document.getElementById("final-msg-text").textContent = CONFIG.finalMessage;
            document.getElementById("final-modal").classList.add("open");
          }
        }
      }

      // Actualizar partículas 3D
      for (let i = fxParticles.length - 1; i >= 0; i--) {
        const p = fxParticles[i];
        p.position.x += p.userData.vx;
        p.position.y += p.userData.vy;
        p.position.z += p.userData.vz;
        p.userData.vy -= 0.004;
        p.userData.life--;
        p.scale.setScalar(Math.max(0.01, p.userData.life / 55));
        if (p.userData.life <= 0) {
          scene.remove(p);
          fxParticles.splice(i, 1);
        }
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
