<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Para Camelita 👑 — Coronitas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-night: #07070b;
      --gold: #f5d076;
      --pink-neon: #ff7eb6;
      --lilac: #c084fc;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-night);
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
    }

    .font-royal {
      font-family: 'Cinzel', serif;
    }

    /* Canvas de fondo a pantalla completa */
    #magic-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Sendero luminoso inferior */
    .luminous-path {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 110px;
      z-index: 4;
      pointer-events: none;
      background: linear-gradient(to top, rgba(192, 132, 252, 0.16) 0%, rgba(245, 208, 118, 0.08) 42%, transparent 100%);
      border-top: 1px solid rgba(245, 208, 118, 0.18);
      box-shadow: 0 -12px 45px rgba(192, 132, 252, 0.14);
    }

    .path-dashes {
      position: absolute;
      bottom: 46px;
      left: 0;
      width: 200%;
      height: 2px;
      background: repeating-linear-gradient(
        to right,
        rgba(245, 208, 118, 0.5) 0px,
        rgba(245, 208, 118, 0.5) 28px,
        transparent 28px,
        transparent 62px
      );
      opacity: 0.55;
      transition: transform 0.12s linear;
    }

    /* Reproductor flotante Glassmorphism */
    .audio-pill {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 60;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      border-radius: 9999px;
      background: rgba(18, 18, 28, 0.65);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(245, 208, 118, 0.3);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .audio-pill:hover {
      border-color: rgba(255, 126, 182, 0.6);
      transform: translateY(-1px);
    }

    .sound-bars {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 16px;
    }
    .sound-bars span {
      width: 3px;
      background: linear-gradient(to top, var(--pink-neon), var(--gold));
      border-radius: 3px;
      height: 4px;
      transition: height 0.2s ease;
    }
    .audio-pill.playing .sound-bars span:nth-child(1) { animation: barBounce 0.7s ease-in-out infinite 0.0s; }
    .audio-pill.playing .sound-bars span:nth-child(2) { animation: barBounce 0.7s ease-in-out infinite 0.2s; }
    .audio-pill.playing .sound-bars span:nth-child(3) { animation: barBounce 0.7s ease-in-out infinite 0.4s; }
    .audio-pill.playing .sound-bars span:nth-child(4) { animation: barBounce 0.7s ease-in-out infinite 0.15s; }

    @keyframes barBounce {
      0%, 100% { height: 4px; }
      50% { height: 15px; }
    }

    /* Fase 1: Overlay e Intro */
    #intro-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: radial-gradient(circle at center, #11111c 0%, #07070b 75%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      transition: opacity 0.9s ease, visibility 0.9s ease;
    }
    #intro-overlay.hidden-phase {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .crown-pulse {
      font-size: 3rem;
      filter: drop-shadow(0 0 18px rgba(245, 208, 118, 0.75));
      animation: pulseGlow 2.2s ease-in-out infinite;
    }
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 14px rgba(245, 208, 118, 0.65)); }
      50% { transform: scale(1.1); filter: drop-shadow(0 0 28px rgba(255, 126, 182, 0.9)); }
    }

    .open-btn {
      position: relative;
      padding: 15px 30px;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 1.05rem;
      letter-spacing: 0.03em;
      color: #fff;
      background: rgba(24, 24, 38, 0.85);
      border: 1.5px solid rgba(245, 208, 118, 0.75);
      box-shadow: 0 0 24px rgba(245, 208, 118, 0.35), inset 0 0 14px rgba(255, 126, 182, 0.2);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.5s ease;
    }
    .open-btn:hover {
      transform: scale(1.04);
      box-shadow: 0 0 36px rgba(255, 126, 182, 0.6), inset 0 0 18px rgba(245, 208, 118, 0.3);
    }

    .intro-text-box {
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 0.9s ease, transform 0.9s ease;
    }
    .intro-text-box.show {
      opacity: 1;
      transform: translateY(0);
    }
    .intro-text-box.drop-exit {
      opacity: 0;
      transform: translateY(-48px);
    }

    .glow-line-1 {
      color: #e5d5b5;
      text-shadow: 0 0 18px rgba(245, 208, 118, 0.45);
    }
    .glow-line-2 {
      color: #ffffff;
      text-shadow: 0 0 20px rgba(255, 126, 182, 0.85), 0 0 42px rgba(255, 126, 182, 0.5);
    }

    /* Escenario principal 2D */
    #stage {
      position: fixed;
      inset: 0;
      z-index: 10;
      opacity: 0;
      transition: opacity 1s ease;
      overflow: hidden;
    }
    #stage.active {
      opacity: 1;
    }

    /* Personaje Camelita (#camelita-container) */
    #camelita-container {
      position: fixed;
      bottom: 62px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: left 0.8s cubic-bezier(0.22, 1, 0.36, 1), transform 0.4s ease;
      pointer-events: none;
    }
    @media (min-width: 768px) {
      #camelita-container.walk-mode {
        left: 24%;
      }
    }
    @media (max-width: 767px) {
      #camelita-container.walk-mode {
        left: 24%;
      }
    }

    .name-badge {
      padding: 4px 14px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 215, 140, 0.45);
      box-shadow: 0 0 18px rgba(255, 126, 182, 0.45);
      margin-bottom: 4px;
      white-space: nowrap;
      position: relative;
    }

    .mini-heart-pop {
      position: absolute;
      right: -18px;
      top: -6px;
      font-size: 1rem;
      opacity: 0;
      pointer-events: none;
    }
    .mini-heart-pop.pop {
      animation: floatMiniHeart 1.4s ease-out forwards;
    }
    @keyframes floatMiniHeart {
      0% { opacity: 0; transform: translateY(4px) scale(0.5); }
      25% { opacity: 1; transform: translateY(-6px) scale(1.2); }
      100% { opacity: 0; transform: translateY(-28px) scale(0.9); }
    }

    /* Dropzone sobre la cabeza */
    #head-dropzone {
      position: relative;
      width: 74px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: -14px;
      z-index: 28;
      border-radius: 9999px;
      transition: background 0.25s ease, box-shadow 0.25s ease;
    }
    #head-dropzone.drag-hover {
      background: rgba(245, 208, 118, 0.22);
      box-shadow: 0 0 24px rgba(245, 208, 118, 0.7);
    }

    #worn-crown {
      width: 58px;
      height: 40px;
      opacity: 0;
      transform: scale(0.4) translateY(-12px);
      transition: opacity 0.35s ease, transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
      filter: drop-shadow(0 0 12px rgba(245, 208, 118, 0.85));
    }
    #worn-crown.visible {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    /* Corona arrastrable inicial (sin transform para no romper position:fixed al arrastrar) */
    #draggable-crown-wrap {
      position: fixed;
      top: 13%;
      left: 0;
      right: 0;
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    #draggable-crown-wrap.done {
      opacity: 0;
      pointer-events: none;
    }

    #draggable-crown {
      width: 82px;
      height: 58px;
      cursor: grab;
      pointer-events: auto;
      touch-action: none;
      filter: drop-shadow(0 0 20px rgba(245, 208, 118, 0.85));
      animation: floatCrown 2.3s ease-in-out infinite;
    }
    #draggable-crown.dragging {
      position: fixed;
      animation: none;
      cursor: grabbing;
      transform: scale(1.15);
      z-index: 90;
    }
    @keyframes floatCrown {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-10px) rotate(3deg); }
    }

    .drag-hint {
      font-size: 0.9rem;
      color: #f5d076;
      background: rgba(15, 15, 25, 0.72);
      border: 1px solid rgba(245, 208, 118, 0.35);
      padding: 6px 14px;
      border-radius: 9999px;
      backdrop-filter: blur(8px);
      text-align: center;
      animation: pulseHint 1.8s ease-in-out infinite;
    }
    @keyframes pulseHint {
      0%, 100% { opacity: 0.75; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(3px); }
    }

    /* Animaciones SVG de Camelita */
    #camelita-svg {
      width: 148px;
      height: 190px;
      overflow: visible;
      filter: drop-shadow(0 12px 18px rgba(0, 0, 0, 0.65));
    }

    /* Estado sentada inicial */
    #camelita-container.sitting #left-leg {
      transform-origin: 58px 142px;
      transform: rotate(38deg) translate(-6px, -6px);
    }
    #camelita-container.sitting #right-leg {
      transform-origin: 90px 142px;
      transform: rotate(-38deg) translate(6px, -6px);
    }
    #camelita-container.sitting #camelita-svg {
      transform: translateY(16px);
      transition: transform 0.5s ease;
    }

    /* Salto feliz al coronar o abrir carta */
    @keyframes happyJump {
      0%, 100% { transform: translateY(0) scale(1); }
      35% { transform: translateY(-28px) scale(1.03, 0.97); }
      65% { transform: translateY(-6px) scale(0.98, 1.03); }
    }
    #camelita-container.jumping #camelita-svg,
    #camelita-container.jumping .name-badge,
    #camelita-container.jumping #head-dropzone {
      animation: happyJump 0.62s ease-in-out 2;
    }

    /* Caminata (.walking) */
    #camelita-container.walking #camelita-svg {
      animation: walkBob 0.55s ease-in-out infinite;
    }
    #camelita-container.walking .name-badge,
    #camelita-container.walking #head-dropzone {
      animation: walkBob 0.55s ease-in-out infinite;
    }
    #camelita-container.walking #left-leg {
      transform-origin: 60px 140px;
      animation: legSwingA 0.55s ease-in-out infinite;
    }
    #camelita-container.walking #right-leg {
      transform-origin: 88px 140px;
      animation: legSwingB 0.55s ease-in-out infinite;
    }
    #camelita-container.walking #left-arm {
      transform-origin: 46px 104px;
      animation: armSwingB 0.55s ease-in-out infinite;
    }
    #camelita-container.walking #right-arm {
      transform-origin: 102px 104px;
      animation: armSwingA 0.55s ease-in-out infinite;
    }
    #camelita-container.walking #hair-back {
      transform-origin: 74px 48px;
      animation: hairSway 1.1s ease-in-out infinite;
    }

    @keyframes walkBob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes legSwingA {
      0%, 100% { transform: rotate(-16deg); }
      50% { transform: rotate(18deg); }
    }
    @keyframes legSwingB {
      0%, 100% { transform: rotate(18deg); }
      50% { transform: rotate(-16deg); }
    }
    @keyframes armSwingA {
      0%, 100% { transform: rotate(-12deg); }
      50% { transform: rotate(14deg); }
    }
    @keyframes armSwingB {
      0%, 100% { transform: rotate(14deg); }
      50% { transform: rotate(-12deg); }
    }
    @keyframes hairSway {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(3deg); }
    }

    /* Parpadeo natural */
    #eyes {
      transform-origin: 74px 66px;
      animation: blinkEyes 4.5s infinite;
    }
    @keyframes blinkEyes {
      0%, 94%, 100% { transform: scaleY(1); }
      97% { transform: scaleY(0.1); }
    }

    /* Mundo Parallax con las 4 estaciones + cofre final */
    #parallax-track {
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      display: flex;
      align-items: center;
      z-index: 15;
      pointer-events: none;
      transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .station-slot {
      width: 100vw;
      height: 100%;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 68px 18px 250px;
      position: relative;
    }
    @media (min-width: 768px) {
      .station-slot {
        justify-content: center;
        align-items: flex-end;
        padding: 40px 8vw 130px 42vw;
      }
    }

    .crown-card {
      width: 100%;
      max-width: 390px;
      border-radius: 24px;
      background: rgba(18, 18, 30, 0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
      overflow: hidden;
      pointer-events: auto;
      transition: border-color 0.5s ease, box-shadow 0.5s ease, transform 0.5s ease;
    }
    .crown-card.lit {
      border-color: rgba(245, 208, 118, 0.65);
      box-shadow: 0 0 38px rgba(255, 126, 182, 0.28), 0 20px 55px rgba(0, 0, 0, 0.7);
      transform: translateY(-4px);
    }

    .crown-img-wrap {
      position: relative;
      width: 100%;
      height: 175px;
      overflow: hidden;
      background: radial-gradient(circle at center, #261a36 0%, #0b0b12 100%);
    }
    @media (min-width: 768px) {
      .crown-img-wrap {
        height: 210px;
      }
    }
    .crown-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 6s ease;
    }
    .crown-card.lit .crown-img-wrap img {
      transform: scale(1.08);
    }
    .crown-img-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(18, 18, 30, 0.95) 0%, transparent 55%);
    }

    /* Barra inferior de navegación */
    #walk-controls {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 45;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      width: calc(100% - 32px);
      max-width: 440px;
      justify-content: center;
    }
    #walk-controls.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .walk-btn {
      padding: 12px 20px;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.92rem;
      background: linear-gradient(135deg, rgba(245, 208, 118, 0.22), rgba(255, 126, 182, 0.24));
      backdrop-filter: blur(12px);
      border: 1px solid rgba(245, 208, 118, 0.55);
      color: #fff;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease;
    }
    .walk-btn:active { transform: scale(0.95); }

    /* Cofre / Carta lacrada final */
    .treasure-box {
      pointer-events: auto;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 26px 28px;
      border-radius: 28px;
      background: rgba(24, 18, 36, 0.78);
      backdrop-filter: blur(16px);
      border: 1.5px solid rgba(245, 208, 118, 0.65);
      box-shadow: 0 0 42px rgba(245, 208, 118, 0.28);
      animation: floatCrown 2.6s ease-in-out infinite;
    }

    /* Modal Carta Final */
    #final-modal {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(7, 7, 11, 0.76);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }
    #final-modal.open {
      opacity: 1;
      visibility: visible;
    }

    .final-letter-card {
      width: 100%;
      max-width: 460px;
      max-height: 86vh;
      overflow-y: auto;
      border-radius: 26px;
      background: linear-gradient(160deg, rgba(22, 20, 34, 0.95), rgba(12, 11, 20, 0.98));
      border: 1.5px solid rgba(245, 208, 118, 0.65);
      box-shadow: 0 0 60px rgba(255, 126, 182, 0.25);
      padding: 28px 24px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Canvas de partículas mágicas -->
  <canvas id="magic-canvas"></canvas>

  <!-- Reproductor Glassmorphism -->
  <button class="audio-pill" id="audio-pill" aria-label="Controlar música">
    <div class="sound-bars">
      <span></span><span></span><span></span><span></span>
    </div>
    <span class="text-xs font-medium text-amber-100/90" id="audio-status-label">Música</span>
  </button>

  <audio id="bg-music" loop preload="auto"></audio>

  <!-- FASE 1: Overlay Inicial + Intro Sincronizada -->
  <div id="intro-overlay">
    <div id="unlock-box" class="flex flex-col items-center gap-6">
      <div class="crown-pulse">👑</div>
      <p class="font-royal text-xs tracking-[0.28em] uppercase text-amber-200/70">Edición Especial</p>
      <button id="open-btn" class="open-btn">
        Para Camelita 👑 <span class="text-pink-300 text-sm block mt-1 font-normal">(Toca para abrir)</span>
      </button>
    </div>

    <div id="intro-text-box" class="intro-text-box hidden max-w-lg px-4">
      <p id="intro-line-1" class="font-royal text-lg sm:text-2xl tracking-widest glow-line-1 mb-4"></p>
      <p id="intro-line-2" class="font-royal text-xl sm:text-3xl font-bold tracking-wider glow-line-2"></p>
    </div>
  </div>

  <!-- FASE 2 & 3: Escenario Interactivo -->
  <main id="stage">
    <!-- Sendero luminoso inferior -->
    <div class="luminous-path">
      <div class="path-dashes" id="path-dashes"></div>
    </div>

    <!-- Corona arrastrable inicial -->
    <div id="draggable-crown-wrap">
      <svg id="draggable-crown" viewBox="0 0 100 70" fill="none">
        <defs>
          <linearGradient id="crownGold" x1="0" y1="0" x2="100" y2="70" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#fde68a"/>
            <stop offset="50%" stop-color="#f59e0b"/>
            <stop offset="100%" stop-color="#fef08a"/>
          </linearGradient>
        </defs>
        <path d="M12 56 L6 20 L30 38 L50 10 L70 38 L94 20 L88 56 Z" fill="url(#crownGold)" stroke="#fff7ed" stroke-width="2.5" stroke-linejoin="round"/>
        <rect x="12" y="54" width="76" height="8" rx="4" fill="#d97706" stroke="#fff7ed" stroke-width="2"/>
        <circle cx="50" cy="10" r="4.5" fill="#ff7eb6"/>
        <circle cx="6" cy="20" r="4" fill="#e0f2fe"/>
        <circle cx="94" cy="20" r="4" fill="#e0f2fe"/>
        <circle cx="50" cy="40" r="4" fill="#ff7eb6"/>
      </svg>
      <div class="drag-hint">Arrastra la coronita hacia la cabeza de Camelita 👑👇</div>
    </div>

    <!-- Mundo Parallax de Estaciones -->
    <div id="parallax-track"></div>

    <!-- Personaje 2D: Camelita -->
    <div id="camelita-container" class="sitting">
      <div class="name-badge">
        ✨ Camelita ✨
        <span class="mini-heart-pop" id="mini-heart">💗</span>
      </div>

      <!-- Zona de detección para soltar la corona -->
      <div id="head-dropzone">
        <svg id="worn-crown" viewBox="0 0 100 70" fill="none">
          <path d="M12 56 L6 20 L30 38 L50 10 L70 38 L94 20 L88 56 Z" fill="url(#crownGold)" stroke="#fff7ed" stroke-width="2.5" stroke-linejoin="round"/>
          <rect x="12" y="54" width="76" height="8" rx="4" fill="#d97706" stroke="#fff7ed" stroke-width="2"/>
          <circle cx="50" cy="10" r="4.5" fill="#ff7eb6"/>
          <circle cx="6" cy="20" r="3.5" fill="#e0f2fe"/>
          <circle cx="94" cy="20" r="3.5" fill="#e0f2fe"/>
        </svg>
      </div>

      <!--
        TIP DE PERSONALIZACIÓN:
        Si deseas usar una imagen .png externa en lugar de este SVG,
        oculta #camelita-svg (display: none) y coloca aquí:
        <img src="camelita.png" alt="Camelita" class="w-36 h-auto" />
      -->
      <svg id="camelita-svg" viewBox="0 0 148 190" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Cabello largo oscuro trasero -->
        <g id="hair-back">
          <path d="M36 52 C28 84 26 122 34 142 C46 146 102 146 114 142 C122 122 120 84 112 52 C102 24 46 24 36 52 Z" fill="#18141c" stroke="#0b090e" stroke-width="2.5"/>
        </g>

        <!-- Piernas -->
        <g id="left-leg">
          <rect x="54" y="138" width="14" height="36" rx="7" fill="#c68b67" stroke="#2d1e17" stroke-width="2"/>
          <path d="M51 168 C51 164 69 164 70 172 C70 176 50 176 51 168 Z" fill="#181822" stroke="#3b3b4d" stroke-width="1.5"/>
        </g>
        <g id="right-leg">
          <rect x="80" y="138" width="14" height="36" rx="7" fill="#c68b67" stroke="#2d1e17" stroke-width="2"/>
          <path d="M78 168 C78 164 96 164 97 172 C97 176 77 176 78 168 Z" fill="#181822" stroke="#3b3b4d" stroke-width="1.5"/>
        </g>

        <!-- Brazo izquierdo -->
        <g id="left-arm">
          <path d="M46 102 C32 114 28 132 36 138 C42 142 50 132 52 116 Z" fill="#14141d" stroke="#2e2e3d" stroke-width="2" stroke-linejoin="round"/>
          <circle cx="38" cy="137" r="6" fill="#c68b67" stroke="#2d1e17" stroke-width="1.8"/>
        </g>

        <!-- Brazo derecho -->
        <g id="right-arm">
          <path d="M102 102 C116 114 120 132 112 138 C106 142 98 132 96 116 Z" fill="#14141d" stroke="#2e2e3d" stroke-width="2" stroke-linejoin="round"/>
          <circle cx="110" cy="137" r="6" fill="#c68b67" stroke="#2d1e17" stroke-width="1.8"/>
        </g>

        <!-- Cuerpo: Hoodie negro oversize -->
        <g id="body">
          <path d="M46 98 C44 92 104 92 102 98 L108 142 C108 148 40 148 40 142 Z" fill="#161620" stroke="#323244" stroke-width="2.2" stroke-linejoin="round"/>
          <!-- Bolsillo canguro + cordones -->
          <path d="M56 124 L92 124 L95 140 L53 140 Z" fill="#1e1e2b" stroke="#2f2f40" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M67 98 L65 114 M81 98 L83 114" stroke="#f5d076" stroke-width="2" stroke-linecap="round"/>
          <!-- Corazoncito bordado en el buzo -->
          <path d="M88 108 C86 105 82 106 82 109 C82 112 88 115 88 115 C88 115 94 112 94 109 C94 106 90 105 88 108 Z" fill="#ff7eb6"/>
        </g>

        <!-- Cabeza -->
        <g id="head">
          <!-- Rostro tez canela suave -->
          <ellipse cx="74" cy="64" rx="33" ry="31" fill="#c68b67" stroke="#2d1e17" stroke-width="2.2"/>
          <!-- Flequillo frontal tierno -->
          <path d="M40 56 C42 32 106 32 108 56 C96 44 84 48 74 42 C64 48 52 44 40 56 Z" fill="#18141c" stroke="#0b090e" stroke-width="2" stroke-linejoin="round"/>
          <!-- Ojos expresivos -->
          <g id="eyes">
            <ellipse cx="60" cy="66" rx="6.5" ry="8" fill="#141016"/>
            <ellipse cx="88" cy="66" rx="6.5" ry="8" fill="#141016"/>
            <!-- Brillos blancos -->
            <circle cx="62" cy="63" r="2.4" fill="#ffffff"/>
            <circle cx="90" cy="63" r="2.4" fill="#ffffff"/>
            <circle cx="58" cy="69" r="1.1" fill="#ffffff"/>
            <circle cx="86" cy="69" r="1.1" fill="#ffffff"/>
          </g>
          <!-- Mejillas sonrojadas -->
          <ellipse id="blush-l" cx="50" cy="75" rx="6" ry="3.2" fill="#f472b6" opacity="0.55"/>
          <ellipse id="blush-r" cx="98" cy="75" rx="6" ry="3.2" fill="#f472b6" opacity="0.55"/>
          <!-- Boca (cambia al coronarla) -->
          <g id="mouth">
            <path id="mouth-path" d="M69 80 Q74 83 79 80" stroke="#4a281d" stroke-width="2.4" stroke-linecap="round" fill="none"/>
          </g>
        </g>
      </svg>
    </div>

    <!-- Controles inferiores del recorrido -->
    <div id="walk-controls">
      <button id="btn-step-walk" class="walk-btn">Seguir caminando con Camelita ➡️</button>
      <button id="btn-auto-walk" class="walk-btn" style="padding: 12px 15px;" title="Auto-caminar">⏸ Auto</button>
    </div>
  </main>

  <!-- FASE 4: Modal de Carta Final -->
  <div id="final-modal">
    <div class="final-letter-card">
      <div class="text-4xl mb-3">💌👑</div>
      <h2 class="font-royal text-2xl font-bold text-amber-200 mb-3" id="final-title">Para Camelita</h2>
      <p class="text-sm sm:text-base text-slate-200/90 leading-relaxed mb-6 whitespace-pre-line" id="final-body"></p>
      <div class="flex flex-wrap gap-3 justify-center">
        <button id="btn-restart-walk" class="walk-btn">Volver a recorrer el camino con Camelita 🔄</button>
        <button id="btn-close-modal" class="walk-btn" style="background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.25);">Cerrar</button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // CONFIGURACIÓN EDITABLE (Personaliza aquí textos, fotos y audio)
    // =========================================================================
    const CONFIG = {
      // Archivo de audio local o URL directa
      audioUrl: "./musica.mp3",

      // Textos de la Fase 1 (Intro sincronizada 0.0s a 4.5s)
      introLine1: "14 DE NOVIEMBRE? NO IMPORTA EL DÍA...",
      introLine2: "ESTAS CORONITAS SON PARA TI 💗... <3",
      introDurationMs: 4500,

      // Las 4 Estaciones de Coronas
      stations: [
        {
          title: "Corona de Cristales y Diamantes",
          // Puedes reemplazar por "./corona1.jpg" si subes tus propias fotos
          image: "https://images.unsplash.com/photo-1596944924616-7b38e7cfac36?auto=format&fit=crop&w=900&q=80",
          meaning: "Por esos ojitos tan lindos y por tener esa luz que brilla incluso en los días más grises ✨"
        },
        {
          title: "Corona Oscura & Estética",
          image: "https://images.unsplash.com/photo-1535632066927-ab7c9ab60908?auto=format&fit=crop&w=900&q=80",
          meaning: "Para la niña más inquieta, única y auténtica; porque tu vibra no la tiene nadie más 💜"
        },
        {
          title: "Corona sobre Rosas Rojas",
          image: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=900&q=80",
          meaning: "Porque hay personas, risas y momentos que se quedan guardados con cariño sin importar el tiempo 🌹"
        },
        {
          title: "Corona Real de Reina",
          image: "https://images.unsplash.com/photo-1605100804763-247f67b3557e?auto=format&fit=crop&w=900&q=80",
          meaning: "Porque no importa qué fecha marque el calendario, Camelita siempre va a merecer todo lo bonito de este mundo 👑"
        }
      ],

      // Carta final de la Fase 4
      finalLetterTitle: "Para mi reina, Camelita 👑",
      finalLetterBody:
        "No hace falta que sea 14 de noviembre ni ninguna fecha especial para recordarte lo increíble que eres.\n\n" +
        "Cada una de estas coronitas representa algo que admiro muchísimo de ti: tu luz, tu esencia única, los momentos tan bonitos y todo lo que mereces.\n\n" +
        "Nunca dejes de brillar, Camelita. Siempre serás merecedora de lo más lindo de este mundo. 💗✨"
    };

    // =========================================================================
    // MOTOR DE PARTÍCULAS MÁGICAS (CANVAS)
    // =========================================================================
    const canvas = document.getElementById("magic-canvas");
    const ctx = canvas.getContext("2d");
    let cw = 0, ch = 0;
    let parallaxOffset = 0;

    const starColors = ["rgba(245, 208, 118,", "rgba(226, 232, 240,", "rgba(192, 132, 252,"];
    const stars = Array.from({ length: 85 }, () => ({
      x: Math.random(),
      y: Math.random() * 0.9,
      r: 0.8 + Math.random() * 2.2,
      speed: 0.00012 + Math.random() * 0.0003,
      color: starColors[Math.floor(Math.random() * starColors.length)],
      phase: Math.random() * Math.PI * 2
    }));

    const burstParticles = [];
    function spawnCelebrationBurst(cx, cy, count = 42) {
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
        const speed = 2.2 + Math.random() * 5.2;
        burstParticles.push({
          x: cx,
          y: cy,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.5,
          life: 1,
          decay: 0.015 + Math.random() * 0.015,
          isHeart: i % 2 === 0,
          size: 6 + Math.random() * 8,
          color: i % 2 === 0 ? "#ff7eb6" : "#f5d076"
        });
      }
    }

    function resizeCanvas() {
      cw = canvas.width = window.innerWidth;
      ch = canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function drawHeart(x, y, size, color, alpha) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = color;
      ctx.translate(x, y);
      ctx.beginPath();
      const s = size * 0.5;
      ctx.moveTo(0, s * 0.4);
      ctx.bezierCurveTo(-s, -s * 0.5, -s * 1.6, s * 0.6, 0, s * 1.5);
      ctx.bezierCurveTo(s * 1.6, s * 0.6, s, -s * 0.5, 0, s * 0.4);
      ctx.fill();
      ctx.restore();
    }

    function renderCanvas() {
      ctx.clearRect(0, 0, cw, ch);
      const now = Date.now() * 0.0025;

      stars.forEach((s) => {
        s.y -= s.speed;
        if (s.y < -0.02) s.y = 0.92;
        const px = ((s.x * cw - parallaxOffset * 0.15) % cw + cw) % cw;
        const py = s.y * ch;
        const alpha = 0.35 + 0.55 * Math.sin(now + s.phase);
        ctx.fillStyle = `${s.color} ${Math.max(0.1, alpha)})`;
        ctx.beginPath();
        ctx.arc(px, py, s.r, 0, Math.PI * 2);
        ctx.fill();
      });

      for (let i = burstParticles.length - 1; i >= 0; i--) {
        const p = burstParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.09;
        p.life -= p.decay;
        if (p.life <= 0) {
          burstParticles.splice(i, 1);
          continue;
        }
        if (p.isHeart) {
          drawHeart(p.x, p.y, p.size, p.color, p.life);
        } else {
          ctx.save();
          ctx.globalAlpha = p.life;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * 0.35, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      requestAnimationFrame(renderCanvas);
    }
    renderCanvas();

    // =========================================================================
    // AUDIO Y FASE 1: INTRO SINCRONIZADA
    // =========================================================================
    const bgMusic = document.getElementById("bg-music");
    bgMusic.src = CONFIG.audioUrl;
    const audioPill = document.getElementById("audio-pill");
    const audioStatusLabel = document.getElementById("audio-status-label");

    const introOverlay = document.getElementById("intro-overlay");
    const unlockBox = document.getElementById("unlock-box");
    const openBtn = document.getElementById("open-btn");
    const introTextBox = document.getElementById("intro-text-box");
    const introLine1 = document.getElementById("intro-line-1");
    const introLine2 = document.getElementById("intro-line-2");
    const stage = document.getElementById("stage");

    introLine1.textContent = CONFIG.introLine1;
    introLine2.textContent = CONFIG.introLine2;

    function updateAudioUI() {
      if (!bgMusic.paused) {
        audioPill.classList.add("playing");
        audioStatusLabel.textContent = "Sonando";
      } else {
        audioPill.classList.remove("playing");
        audioStatusLabel.textContent = "Pausado";
      }
    }

    audioPill.addEventListener("click", async () => {
      if (bgMusic.paused) {
        try { await bgMusic.play(); } catch {}
      } else {
        bgMusic.pause();
      }
      updateAudioUI();
    });

    openBtn.addEventListener("click", async () => {
      try {
        await bgMusic.play();
      } catch {}
      updateAudioUI();

      unlockBox.style.opacity = "0";
      unlockBox.style.pointerEvents = "none";
      setTimeout(() => {
        unlockBox.classList.add("hidden");
        introTextBox.classList.remove("hidden");
        requestAnimationFrame(() => introTextBox.classList.add("show"));
      }, 380);

      // A los 4.5s: Drop del piano -> entra el escenario
      setTimeout(() => {
        introTextBox.classList.add("drop-exit");
        setTimeout(() => {
          introOverlay.classList.add("hidden-phase");
          stage.classList.add("active");
        }, 700);
      }, CONFIG.introDurationMs);
    });

    // =========================================================================
    // FASE 2: DRAG & DROP DE LA CORONA (Pointer Events API)
    // =========================================================================
    const camelitaContainer = document.getElementById("camelita-container");
    const headDropzone = document.getElementById("head-dropzone");
    const wornCrown = document.getElementById("worn-crown");
    const draggableCrownWrap = document.getElementById("draggable-crown-wrap");
    const draggableCrown = document.getElementById("draggable-crown");
    const mouthPath = document.getElementById("mouth-path");
    const blushL = document.getElementById("blush-l");
    const blushR = document.getElementById("blush-r");

    let isCrowned = false;
    let isDragging = false;

    function isOverDropzone(clientX, clientY) {
      const r = headDropzone.getBoundingClientRect();
      const cx = r.left + r.width / 2;
      const cy = r.top + r.height / 2;
      const dist = Math.hypot(clientX - cx, clientY - cy);
      return dist <= 95;
    }

    draggableCrown.addEventListener("pointerdown", (e) => {
      if (isCrowned) return;
      e.preventDefault();
      isDragging = true;
      draggableCrown.classList.add("dragging");
      moveCrownTo(e.clientX, e.clientY);
    });

    window.addEventListener("pointermove", (e) => {
      if (!isDragging || isCrowned) return;
      moveCrownTo(e.clientX, e.clientY);
      if (isOverDropzone(e.clientX, e.clientY)) {
        headDropzone.classList.add("drag-hover");
      } else {
        headDropzone.classList.remove("drag-hover");
      }
    });

    function finishDrag(e) {
      if (!isDragging || isCrowned) return;
      isDragging = false;
      headDropzone.classList.remove("drag-hover");

      if (e && isOverDropzone(e.clientX, e.clientY)) {
        crownCamelita();
      } else {
        draggableCrown.classList.remove("dragging");
        draggableCrown.style.left = "";
        draggableCrown.style.top = "";
      }
    }

    window.addEventListener("pointerup", finishDrag);
    window.addEventListener("pointercancel", finishDrag);

    function moveCrownTo(cx, cy) {
      draggableCrown.style.left = `${cx - 41}px`;
      draggableCrown.style.top = `${cy - 29}px`;
    }

    function crownCamelita() {
      isCrowned = true;
      draggableCrownWrap.classList.add("done");
      wornCrown.classList.add("visible");

      // Expresión radiante + más rubor
      mouthPath.setAttribute("d", "M66 79 Q74 88 82 79");
      blushL.setAttribute("opacity", "0.85");
      blushR.setAttribute("opacity", "0.85");

      // Explosión de corazones y destellos
      const r = headDropzone.getBoundingClientRect();
      spawnCelebrationBurst(r.left + r.width / 2, r.top + r.height / 2, 48);

      // Se pone de pie, salta feliz y comienza la caminata
      camelitaContainer.classList.remove("sitting");
      camelitaContainer.classList.add("jumping");

      setTimeout(() => {
        camelitaContainer.classList.remove("jumping");
        camelitaContainer.classList.add("walk-mode");
        buildParallaxStations();
        document.getElementById("walk-controls").classList.add("visible");
        goToStation(0);
      }, 1150);
    }

    // =========================================================================
    // FASE 3 & 4: PARALLAX, 4 ESTACIONES DE CORONAS Y COFRE FINAL
    // =========================================================================
    const parallaxTrack = document.getElementById("parallax-track");
    const pathDashes = document.getElementById("path-dashes");
    const miniHeart = document.getElementById("mini-heart");
    const btnStepWalk = document.getElementById("btn-step-walk");
    const btnAutoWalk = document.getElementById("btn-auto-walk");
    const finalModal = document.getElementById("final-modal");
    const finalTitle = document.getElementById("final-title");
    const finalBody = document.getElementById("final-body");
    const btnRestartWalk = document.getElementById("btn-restart-walk");
    const btnCloseModal = document.getElementById("btn-close-modal");

    finalTitle.textContent = CONFIG.finalLetterTitle;
    finalBody.textContent = CONFIG.finalLetterBody;

    let currentStation = -1;
    let autoWalkEnabled = true;
    let autoTimer = null;
    let typewriterTimer = null;
    const totalSlots = CONFIG.stations.length + 1; // 4 coronas + cofre final

    function buildParallaxStations() {
      parallaxTrack.innerHTML = "";
      CONFIG.stations.forEach((st, idx) => {
        const slot = document.createElement("section");
        slot.className = "station-slot";
        slot.innerHTML = `
          <article class="crown-card" id="crown-card-${idx}">
            <div class="crown-img-wrap">
              <img src="${st.image}" alt="${st.title}" loading="eager" />
              <div class="crown-img-overlay"></div>
              <span class="absolute top-3 left-3 text-xs font-royal tracking-widest uppercase px-3 py-1 rounded-full bg-black/60 border border-amber-200/35 text-amber-200">
                Corona ${idx + 1} de ${CONFIG.stations.length}
              </span>
            </div>
            <div class="p-5">
              <h3 class="font-royal text-lg font-bold text-amber-200 mb-2">${st.title}</h3>
              <p class="text-sm sm:text-base text-slate-200/95 leading-relaxed min-h-[4.5rem]" id="typewriter-${idx}"></p>
            </div>
          </article>
        `;
        parallaxTrack.appendChild(slot);
      });

      // Estación final: Carta Lacrada / Cofre Brillante
      const endSlot = document.createElement("section");
      endSlot.className = "station-slot";
      endSlot.innerHTML = `
        <div class="treasure-box" id="treasure-box">
          <div class="text-5xl">💌</div>
          <h3 class="font-royal text-xl font-bold text-amber-200 text-center">Carta Real para Camelita</h3>
          <p class="text-xs sm:text-sm text-pink-200/90 text-center">Toca el cofre para abrir tu dedicatoria ✨</p>
        </div>
      `;
      parallaxTrack.appendChild(endSlot);

      document.getElementById("treasure-box").addEventListener("click", openFinalLetter);
    }

    function runTypewriter(el, text) {
      clearInterval(typewriterTimer);
      el.textContent = "";
      let i = 0;
      typewriterTimer = setInterval(() => {
        el.textContent += text.charAt(i);
        i++;
        if (i >= text.length) clearInterval(typewriterTimer);
      }, 28);
    }

    function triggerMiniHeart() {
      miniHeart.classList.remove("pop");
      void miniHeart.offsetWidth;
      miniHeart.classList.add("pop");
    }

    function goToStation(index) {
      if (index < 0 || index >= totalSlots) return;
      currentStation = index;

      // Animación de caminata durante el desplazamiento
      camelitaContainer.classList.add("walking");
      parallaxOffset = index * window.innerWidth;
      parallaxTrack.style.transform = `translateX(-${index * 100}vw)`;
      pathDashes.style.transform = `translateX(-${(index * 120) % 400}px)`;

      // Llega frente a la vitrina y se detiene suavemente
      setTimeout(() => {
        camelitaContainer.classList.remove("walking");
        triggerMiniHeart();

        if (index < CONFIG.stations.length) {
          document.querySelectorAll(".crown-card").forEach((c, i) => {
            c.classList.toggle("lit", i === index);
          });
          const twEl = document.getElementById(`typewriter-${index}`);
          runTypewriter(twEl, CONFIG.stations[index].meaning);
          btnStepWalk.textContent =
            index === CONFIG.stations.length - 1
              ? "Ir al final del camino 💌"
              : "Seguir caminando con Camelita ➡️";
        } else {
          btnStepWalk.textContent = "Abrir Carta Real 💌";
        }

        scheduleAutoNext();
      }, 900);
    }

    function scheduleAutoNext() {
      clearTimeout(autoTimer);
      if (!autoWalkEnabled || currentStation >= totalSlots - 1) return;
      autoTimer = setTimeout(() => {
        goToStation(currentStation + 1);
      }, 5600);
    }

    btnStepWalk.addEventListener("click", () => {
      clearTimeout(autoTimer);
      if (currentStation < totalSlots - 1) {
        goToStation(currentStation + 1);
      } else {
        openFinalLetter();
      }
    });

    btnAutoWalk.addEventListener("click", () => {
      autoWalkEnabled = !autoWalkEnabled;
      btnAutoWalk.textContent = autoWalkEnabled ? "⏸ Auto" : "▶ Auto";
      if (autoWalkEnabled) scheduleAutoNext();
      else clearTimeout(autoTimer);
    });

    function openFinalLetter() {
      clearTimeout(autoTimer);
      camelitaContainer.classList.add("jumping");
      const r = camelitaContainer.getBoundingClientRect();
      spawnCelebrationBurst(r.left + r.width / 2, r.top + 40, 46);
      setTimeout(() => {
        camelitaContainer.classList.remove("jumping");
        finalModal.classList.add("open");
      }, 650);
    }

    btnCloseModal.addEventListener("click", () => {
      finalModal.classList.remove("open");
    });

    btnRestartWalk.addEventListener("click", () => {
      finalModal.classList.remove("open");
      goToStation(0);
    });
  </script>
</body>
